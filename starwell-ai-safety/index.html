<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Safety Field Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Caveat:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen lesson app. Navy top bar (stop + progress), one phone-sized card at a time, each card = a drawing that animates in + a named idea + a tool; thumb-zone Back/Next; sign-in picks the person and personalizes key moments. Deliberately single light theme (the Listen First painterly world). */
:root{
  --paper:#FBF1DD; --sand:#F3DDB2; --sand2:#E7C690; --sand3:#D7AA68; --line:rgba(14,31,63,.14);
  --cobalt:#2E6CCB; --ultra:#1F4C9C; --navy:#142B55; --ink:#0E1F3F; --mute:#566078;
  --verm:#EE6A2C; --ember:#C64A1C; --gold:#F2B33D; --cream:#FFF4DE;
  --go:#2F7D52; --go-bg:#DCEBD8; --maybe:#9A5C00; --maybe-bg:#F7E2B5; --stop:#B5361F; --stop-bg:#F6D3C7;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --hand:"Caveat","Comic Sans MS",cursive;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gut:max(18px, env(safe-area-inset-left, 0px));
  --gutR:max(18px, env(safe-area-inset-right, 0px));
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.01em;color:var(--navy);text-wrap:balance;margin:0;line-height:.98}
p{margin:0}
a{color:var(--ultra)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px;border-radius:6px}

.app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.wrap{max-width:720px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gutR)}
.top{background:var(--navy);color:var(--cream);padding-top:env(safe-area-inset-top,0px);position:relative;z-index:5}
.top .wrap{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding-block:9px 7px}
.menuBtn{display:inline-flex;align-items:center;gap:8px;background:rgba(255,244,222,.1);border:1.5px solid rgba(255,244,222,.28);border-radius:10px;padding:6px 11px;font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--cream);min-height:40px}
.menuBtn svg{width:18px;height:18px}
.where{min-width:0;display:grid;line-height:1.1}
.where b{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where small{font-size:12.5px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me{display:flex;align-items:center;gap:8px}
.count{font-family:var(--display);font-weight:600;font-size:16px;opacity:.85;font-variant-numeric:tabular-nums}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px;color:var(--cream);background:var(--verm);border:2px solid var(--cream)}
.segs{display:flex;gap:4px;padding-block:0 9px}
.segs i{flex:1;height:4px;border-radius:2px;background:rgba(255,244,222,.22);transition:background .3s}
.segs i.done{background:var(--cream)}
.segs i.now{background:var(--verm)}

.stage{position:relative;overflow:hidden;background:var(--paper)}
.tex{position:absolute;inset:0;pointer-events:none;background-size:340px 340px;z-index:0;mix-blend-mode:multiply;opacity:.35}
.card{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;z-index:1}
.card>.wrap{min-height:100%;display:flex;flex-direction:column;gap:11px;padding-block:16px 12px}
.morehint{position:absolute;left:0;right:0;bottom:0;height:40px;z-index:3;pointer-events:none;background:linear-gradient(to bottom,rgba(251,241,221,0),var(--paper));display:flex;justify-content:center;align-items:flex-end;padding-bottom:3px}
.morehint span{font-family:var(--hand);font-weight:700;font-size:18px;color:var(--ember)}
.bottom{background:var(--paper);border-top:1.5px solid var(--sand2);padding-bottom:env(safe-area-inset-bottom,0px);position:relative;z-index:5}
.bottom .wrap{display:flex;gap:10px;padding-block:9px}
.back{flex:none;width:54px;height:52px;border-radius:12px;border:1.5px solid var(--sand3);background:var(--cream);color:var(--navy);display:grid;place-items:center}
.back svg{width:22px;height:22px}
.back:disabled{opacity:.35;cursor:default}
.next{flex:1;height:52px;border-radius:12px;border:0;background:var(--verm);color:var(--cream);font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 14px}
.next:hover{background:var(--ember)}
.next:disabled{background:var(--sand3);cursor:default}
.next span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sheet{position:fixed;inset:0;z-index:20;background:rgba(14,31,63,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{width:100%;max-width:720px;max-height:90%;overflow-y:auto;background:var(--paper);border-radius:18px 18px 0 0;padding:16px var(--gutR) calc(16px + env(safe-area-inset-bottom,0px)) var(--gut);display:grid;gap:10px}
.sheet .ph{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet h2{font-size:28px}
.close{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--sand3);background:var(--cream);font-size:22px;line-height:1;color:var(--navy)}
.stops{display:grid;gap:7px}
.stopBtn{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;padding:8px 12px;border-radius:12px;border:1.5px solid var(--sand2);background:var(--cream);min-height:54px}
.stopBtn .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--sand);font-family:var(--display);font-weight:800;font-size:18px;color:var(--navy)}
.stopBtn b{display:block;font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;color:var(--navy);line-height:1.05}
.stopBtn small{color:var(--mute);font-size:13px}
.stopBtn .st{font-size:13px;color:var(--mute)}
.stopBtn.cur{border-color:var(--verm);background:#FFE9D8}
.stopBtn.cur .n{background:var(--verm);color:var(--cream)}
.stopBtn.seen .n{background:var(--navy);color:var(--cream)}
.switch{justify-self:start;border-radius:10px;border:1.5px solid var(--sand3);background:var(--cream);padding:8px 14px;min-height:44px;font-weight:600;color:var(--navy)}

/* content */
.eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:14px;color:var(--ember)}
.t1{font-size:clamp(38px,10.5vw,58px)}
.t2{font-size:clamp(29px,8vw,42px)}
.t1 span:not(.w),.t2 span:not(.w){color:var(--verm);background:linear-gradient(var(--gold),var(--gold)) no-repeat 0 88%/0% 30%;padding:0 .04em}
.card.hl .t1 span:not(.w),.card.hl .t2 span:not(.w){animation:hlsweep .55s cubic-bezier(.3,.8,.3,1) var(--hd,.45s) forwards}
@keyframes hlsweep{to{background-size:100% 30%}}
.w{display:inline-block}
.idea{font-size:16.5px;line-height:1.45}
.handnote{font-family:var(--hand);font-weight:700;font-size:22px;line-height:1.1;color:var(--ultra)}
.box{background:var(--cream);border:1.5px solid var(--sand3);border-radius:14px;padding:12px 14px;display:grid;gap:5px}
.rule{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;background:var(--navy);color:var(--cream);border-radius:12px;padding:10px 14px;font-size:15px;font-weight:600}
.rule::before{content:"RULE";font-family:var(--display);font-weight:800;letter-spacing:.12em;font-size:13px;background:var(--gold);color:var(--navy);border-radius:5px;padding:3px 7px}
.mission{border:2px dashed var(--verm);border-radius:12px;padding:7px 12px;background:#FFF6EA;font-size:14.5px;line-height:1.35}
.mission .handnote{color:var(--ember);font-size:20px;margin-right:4px}
.q{display:block;font-weight:600;color:var(--navy)}
.q::before{content:"“"}
.q::after{content:"”"}
.mute{color:var(--mute);font-size:14.5px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.pill.go{background:var(--go-bg);color:var(--go)}.pill.maybe{background:var(--maybe-bg);color:var(--maybe)}.pill.stop{background:var(--stop-bg);color:var(--stop)}
.btnA{justify-self:start;display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:9px 15px;min-height:44px;font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.05em;text-transform:uppercase;border:1.5px solid var(--navy);background:var(--navy);color:var(--cream)}
.btnA.ghost{background:var(--cream);color:var(--navy);border-color:var(--sand3)}
.art{display:block;width:100%;height:auto;max-width:100%}
.art.sm{max-height:106px;width:auto;margin:0 auto}
.say{font-weight:600;color:var(--navy)}
.tabs{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:4px;background:var(--sand);border-radius:12px;padding:4px}
.tabs button{border:0;border-radius:9px;background:transparent;min-height:40px;font-family:var(--display);font-weight:800;font-size:15.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--navy);padding:4px 6px;line-height:1.05}
.tabs button[aria-selected="true"]{background:var(--navy);color:var(--cream)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pager .dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pager .dots i{width:8px;height:8px;border-radius:50%;background:var(--sand3)}
.pager .dots i.on{background:var(--verm)}
.sq{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--sand3);background:var(--cream);color:var(--navy);display:grid;place-items:center;flex:none}
.sq svg{width:18px;height:18px}

/* login */
.who{display:grid;gap:8px}
.who button{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;padding:7px 14px;border-radius:14px;border:2px solid var(--sand3);background:var(--cream);min-height:62px}
.who button .av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:26px;color:var(--cream)}
.who button b{font-family:var(--display);font-weight:800;font-size:28px;text-transform:uppercase;color:var(--navy);line-height:1}
.who button small{display:block;color:var(--mute);font-size:14px}
.who button[aria-pressed="true"]{border-color:var(--verm);background:#FFE9D8}
.who button .ck{font-family:var(--display);font-weight:800;font-size:22px;color:var(--verm);opacity:0}
.who button[aria-pressed="true"] .ck{opacity:1}
.cover-art{margin:-16px calc(-1 * var(--gutR)) 0 calc(-1 * var(--gut));background:var(--sand);overflow:hidden}
.cover-art svg{display:block;width:100%;height:auto}

/* timeline */
.tl{position:relative}
.tl svg{max-height:96px}
.tlBtns{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-top:-6px}
.tlBtns button{border:0;background:transparent;font-family:var(--display);font-weight:800;font-size:13.5px;color:var(--navy);padding:4px 0;min-height:36px;border-radius:8px;line-height:1.05}
.tlBtns button[aria-selected="true"]{background:var(--navy);color:var(--cream)}
.tlBox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start}
.tlBox .yr{font-family:var(--display);font-weight:800;font-size:30px;color:var(--verm);line-height:1;grid-row:span 2}
.tlBox b{font-size:16px;color:var(--navy)}
.tlBox p{font-size:14.5px}
.tlBox .lesson{grid-column:1/-1;font-family:var(--hand);font-weight:700;font-size:20px;color:var(--ultra)}

/* value equation */
.veq{display:grid;gap:6px}
.vrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.vt{border-radius:12px;padding:8px 10px;display:grid;gap:3px;border:1.5px solid var(--line);background:var(--cream)}
.vt b{font-family:var(--display);font-weight:800;font-size:16px;text-transform:uppercase;line-height:1.05}
.vt.up b{color:var(--go)}.vt.down b{color:var(--stop)}
.vt .q{font-size:13px;font-weight:500;line-height:1.3}
.vt input{width:100%;accent-color:var(--navy);margin:2px 0 0}
.vbar{height:3px;background:var(--navy);border-radius:2px;position:relative}
.vbar::after{content:"÷";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--paper);padding:0 8px;font-family:var(--display);font-weight:800;font-size:20px;color:var(--navy)}
.vout{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:15px;color:var(--navy)}
.vmeter{height:14px;border-radius:7px;background:var(--sand);overflow:hidden}
.vmeter i{display:block;height:100%;width:50%;background:linear-gradient(90deg,var(--gold),var(--verm));border-radius:7px;transition:width .5s cubic-bezier(.3,1.3,.5,1)}

/* compare */
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cmp>div{border-radius:12px;background:var(--cream);border:1.5px solid var(--line);overflow:hidden;display:grid;align-content:start}
.cmp svg{display:block;width:100%;height:auto;max-height:110px;background:var(--sand)}
.cmp .cap{padding:5px 10px;display:grid;gap:2px}
.cmp b{font-family:var(--display);font-weight:800;font-size:17px;text-transform:uppercase;color:var(--navy)}
.cmp .good b{color:var(--go)}.cmp .bad b{color:var(--stop)}
.cmp p{font-size:13.5px}
.talk{font-size:14.5px;gap:3px}.talk b{font-family:var(--display);font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:14px;color:var(--mute)}.talk .you{color:var(--navy);font-weight:700}.talk .you b{color:var(--verm)}
.bubbles{display:grid;gap:7px}
.bub{border-radius:15px;padding:8px 13px;font-size:15px;font-weight:600;max-width:90%}
.bub.they{background:var(--sand);color:var(--navy);justify-self:start;border-bottom-left-radius:4px}
.bub.you{background:var(--navy);color:var(--cream);justify-self:end;border-bottom-right-radius:4px}
.bub small{display:block;font-family:var(--display);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:11.5px;opacity:.75}

/* ladder */
.lad{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start}
.lad svg{width:96px;height:auto}
.rungBtn{cursor:pointer}
.rungBtn text{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.06em}
.lpanel{display:grid;gap:7px;min-width:0}
.lpanel .nm{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.lpanel .nm b{font-family:var(--display);font-weight:800;font-size:40px;line-height:.9;color:var(--navy);text-transform:uppercase}
.lpanel .nm span{font-family:var(--display);font-weight:600;font-size:14px;color:var(--ember);letter-spacing:.08em;text-transform:uppercase}
.lpanel .goal{font-size:14.5px;color:var(--mute)}
.lpanel .q{font-weight:500;font-size:14.5px;padding-left:10px;border-left:3px solid var(--sand3);line-height:1.35}
.lpanel .q.key{font-weight:700;border-left-color:var(--verm)}
.lpanel .lf{font-size:13.5px;border-top:2px dashed var(--sand3);padding-top:6px}
#climber{transition:transform .5s cubic-bezier(.3,1.3,.5,1)}

/* silence timer */
.chipset{display:flex;flex-wrap:wrap;gap:7px}
.chipset span{background:var(--navy);color:var(--cream);border-radius:999px;padding:6px 13px;font-size:14.5px}
.silence{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;align-items:center}
.silence button{border:0;background:transparent;padding:0;width:110px;height:110px}
.silence svg{width:110px;height:110px}
#ring{transition:stroke-dashoffset 1s linear}
.flip{display:grid;gap:6px;align-content:start;min-height:138px;position:relative;padding-right:56px}
.flipGear{position:absolute;right:10px;top:10px;width:40px;height:40px}
.drive{transform-box:view-box}
.on-card .drive{animation:drive 1.5s cubic-bezier(.2,.8,.3,1) .3s both}
@keyframes drive{from{transform:translateX(-900px)}to{transform:none}}
.flip .lab{font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.12em;text-transform:uppercase}
.flip .weak{color:var(--stop);text-decoration:line-through;text-decoration-thickness:1.5px;font-size:18px}
.flip .strong{color:var(--navy);font-weight:700;font-size:19px;line-height:1.3}
.flip .why{font-size:14.5px;color:var(--mute)}

/* ultimate questions */
.uq{display:grid;gap:8px;align-content:start}
.uq .num{display:flex;align-items:center;gap:10px}
.uq .num b{font-family:var(--display);font-weight:800;font-size:54px;line-height:.8;color:var(--verm)}
.uq .num span{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.uq .big{font-family:var(--display);font-weight:800;font-size:clamp(25px,7vw,34px);line-height:1.05;color:var(--navy);text-transform:uppercase;text-wrap:balance}
.uq dl{margin:0;display:grid;gap:6px}
.uq dl div{display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px;font-size:14px;line-height:1.35}
.uq dt{font-family:var(--display);font-weight:800;font-size:13.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ember)}
.uq dd{margin:0}
.pocket{display:grid;gap:3px;counter-reset:pk;padding:9px 12px}
.pocket div{display:grid;grid-template-columns:20px minmax(0,1fr);gap:6px;font-size:13.5px;font-weight:600;color:var(--navy);line-height:1.25}
.pocketRow{display:flex;align-items:center;gap:10px}.pocketRow svg{width:30px;height:45px;flex:none}
.pocket div::before{counter-increment:pk;content:counter(pk);font-family:var(--display);font-weight:800;font-size:19px;color:var(--verm);line-height:1}

/* listen */
.sigs{display:grid;gap:6px;grid-template-columns:repeat(2,minmax(0,1fr))}
.sig{display:grid;grid-template-columns:7px minmax(0,1fr);gap:9px;text-align:left;padding:7px 10px;border-radius:10px;background:var(--cream);border:1.5px solid var(--line);min-height:44px;align-items:stretch}
.sig i{border-radius:4px;background:var(--c)}
.sig b{font-size:14.5px;color:var(--navy);line-height:1.2;display:block}
.sig[aria-pressed="true"]{border-color:var(--c);background:#fff}
.sigEx{font-size:15px;min-height:62px}
.sigEx .q{font-weight:600}
.s-rep{--c:#2E6CCB}.s-work{--c:#EE6A2C}.s-emo{--c:#B5361F}.s-num{--c:#2F7D52}.s-one{--c:#7A4FB0}.s-alw{--c:#9A5C00}
.wave rect{transform-box:fill-box;transform-origin:center}
.on-card .wave rect{animation:wv 1.1s ease-in-out infinite alternate}
@keyframes wv{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.quote{font-size:16px;line-height:1.7}
.quote mark{background:transparent;color:inherit;border-radius:3px;transition:background .3s,box-shadow .3s}
.quote.show mark{background:color-mix(in srgb,var(--c) 16%,transparent);box-shadow:inset 0 -3px 0 var(--c)}
.quote mark sup{display:none;font-family:var(--display);font-weight:800;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--c);margin-left:2px}
.quote.show mark sup{display:inline}
.found{display:grid;gap:5px;counter-reset:f;font-size:14.5px}
.found div{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start}
.found div::before{counter-increment:f;content:counter(f);width:24px;height:24px;border-radius:50%;background:var(--navy);color:var(--cream);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px}
.found b{color:var(--navy)}
.slot{display:inline;background:var(--sand);border:1.5px dashed var(--sand3);border-radius:6px;padding:0 5px;font-weight:500}
.formula{font-size:16.5px;line-height:1.55;font-weight:600;color:var(--navy)}
.steps3{display:grid;gap:5px}
.steps3>div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:6px 11px;line-height:1.38;border-radius:11px;background:var(--cream);border:1px solid var(--line);font-size:14.5px}
.steps3 .tag{font-family:var(--display);font-weight:800;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;background:var(--navy);color:var(--cream);border-radius:6px;padding:3px 7px;white-space:nowrap}
.steps3 b{color:var(--navy)}
.copyable{position:relative;background:var(--navy);color:var(--cream);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.45;max-height:118px;overflow-y:auto;white-space:pre-wrap}
.recdot{transform-box:fill-box;transform-origin:center}
.on-card .recdot{animation:rec 1.2s ease-in-out infinite}
@keyframes rec{50%{opacity:.25}}

/* sort */
.vsrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.vsrow>div{display:grid;justify-items:center;text-align:center;gap:3px;padding:10px;border-radius:12px;background:var(--cream);border:1.5px solid var(--line)}
.vsrow>div.bad{border-color:var(--stop)}
.vsrow svg{width:64px;height:64px}
.vsrow b{font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;color:var(--navy)}
.vsrow p{font-size:13.5px}
.traps{display:grid;gap:6px}
.traps>div{padding:8px 12px;border-radius:11px;background:var(--cream);border:1px solid var(--line);font-size:14.5px}
.traps b{color:var(--navy)}
fieldset{border:0;margin:0;padding:0;min-width:0}
.dials{display:grid;gap:6px}
.dials fieldset{display:grid;grid-template-columns:78px minmax(0,1fr);gap:8px;align-items:center}
.dials legend{float:left;width:78px;margin:0;font-family:var(--display);font-weight:800;font-size:15px;line-height:1.05;text-transform:uppercase;color:var(--navy);padding:0}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.seg label{position:relative;display:grid;place-items:center;text-align:center;min-height:44px;padding:3px 4px;border-radius:9px;border:1.5px solid var(--sand3);background:var(--cream);font-size:12.5px;line-height:1.15;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg label:has(input:checked){background:var(--navy);border-color:var(--navy);color:var(--cream);font-weight:600}
.seg label:has(input:focus-visible){outline:3px solid var(--cobalt);outline-offset:2px}
.verdict{display:grid;grid-template-columns:112px minmax(0,1fr);gap:12px;align-items:center;background:var(--navy);color:var(--cream);border-radius:14px;padding:9px 14px}
.verdict svg{width:112px;height:auto}
.verdict .v{font-family:var(--display);font-weight:800;font-size:27px;text-transform:uppercase;line-height:1}
.verdict p{font-size:13.5px;opacity:.92}
#needle{transition:transform .6s cubic-bezier(.3,1.4,.5,1);transform-origin:150px 150px}
.exs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.exs button{border-radius:999px;border:1.5px solid var(--sand3);background:var(--cream);font-size:13px;padding:4px 10px;min-height:34px}
.calc{display:grid;gap:8px}
.calc .r{display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:10px;align-items:center;font-size:14.5px}
.calc input{width:100%;font:inherit;font-size:17px;font-variant-numeric:tabular-nums;padding:8px 10px;border-radius:9px;border:1.5px solid var(--sand3);background:var(--cream);color:var(--ink);text-align:right;min-height:44px}
.calc .out{border-top:2px solid var(--navy);padding-top:6px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.calc .out b{font-family:var(--display);font-weight:800;font-size:42px;line-height:1;color:var(--verm);font-variant-numeric:tabular-nums}
.coins{display:flex;gap:3px;align-items:flex-end;height:44px}
.coins i{width:22px;border-radius:4px;background:var(--gold);box-shadow:inset 0 -3px 0 rgba(14,31,63,.18);transition:height .5s cubic-bezier(.3,1.3,.5,1)}
.flow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.stg{display:grid;grid-template-columns:20px minmax(0,1fr) 10px;gap:6px;align-items:center;text-align:left;padding:2px 9px;border-radius:9px;background:var(--cream);border:1.5px solid var(--sand3);min-height:34px}
.stg span{font-family:var(--display);font-weight:800;font-size:15px;color:var(--ember)}
.stg b{font-family:var(--display);font-weight:800;font-size:15px;line-height:1.05;text-transform:uppercase;color:var(--navy)}
.stg i{width:10px;height:10px;border-radius:50%}
.stg[aria-selected="true"]{background:var(--navy);border-color:var(--navy)}
.stg[aria-selected="true"] b{color:var(--cream)}
.stg[aria-selected="true"] span{color:var(--gold)}
i.go{background:var(--go)}i.maybe{background:var(--maybe)}i.stop{background:var(--stop)}
.stgbox{display:grid;gap:3px;font-size:13.5px;padding:8px 12px;line-height:1.35}
.stgbox b.k{color:var(--ember);font-family:var(--display);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:13.5px}

/* ai */
.checks3{display:grid;gap:6px;counter-reset:c}
.checks3>div{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;background:var(--navy);color:var(--cream);border-radius:11px;padding:9px 12px;font-size:14.5px;line-height:1.35}
.checks3>div::before{counter-increment:c;content:counter(c);font-family:var(--display);font-weight:800;font-size:28px;line-height:.9;color:var(--gold)}
.fitlist{margin:0;padding:12px 14px 12px 32px;border-radius:12px;display:grid;gap:6px;font-size:15px}
.fitlist.go{background:var(--go-bg)}.fitlist.maybe{background:var(--maybe-bg)}.fitlist.stop{background:var(--stop-bg)}
.acc{display:grid;gap:5px}
.acc details{border-radius:11px;background:var(--cream);border:1px solid var(--line);overflow:hidden}
.acc summary{list-style:none;display:grid;grid-template-columns:24px minmax(0,1fr) 16px;gap:9px;align-items:center;padding:4px 12px;min-height:42px;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc summary .n{font-family:var(--display);font-weight:800;font-size:22px;color:var(--verm);line-height:1}
.acc summary b{font-family:var(--display);font-weight:800;font-size:17.5px;text-transform:uppercase;color:var(--navy);line-height:1.05;margin-right:6px}
.acc summary .handnote{font-size:17px;white-space:nowrap}
.acc summary .pm{font-family:var(--display);font-weight:800;font-size:22px;color:var(--sand3);text-align:center}
.acc details[open] summary .pm{transform:rotate(45deg)}
.acc .body{padding:0 12px 10px 45px;display:grid;gap:5px;font-size:14.5px}
.acc .body .ck{color:var(--mute)}
.acc details.paper{background:var(--stop-bg)}
.sw summary{grid-template-columns:minmax(0,1fr) auto 16px}
.sw .body{padding-left:12px}

/* promise */
.buckets{display:grid;gap:6px}
.bucket{position:relative;padding-right:54px!important;border-radius:12px;padding:7px 13px;color:var(--cream);display:grid;gap:2px}
.bi{position:absolute;right:10px;top:50%;width:36px;height:36px;margin-top:-18px}
.bucket b{font-family:var(--display);font-weight:800;font-size:21px;text-transform:uppercase;line-height:1}
.bucket .q{color:inherit;font-weight:500;font-size:14.5px}
.bucket small{font-size:12.5px;opacity:.88;line-height:1.3}
.bucket.k{background:var(--go)}.bucket.t{background:var(--ultra)}.bucket.w{background:var(--navy)}
.loopArt{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:center}
.loopArt svg{width:150px;height:150px}
.loopList{display:grid;gap:4px;counter-reset:l;font-size:14px}
.loopList div{display:grid;grid-template-columns:20px minmax(0,1fr);gap:6px;line-height:1.3}
.loopList div::before{counter-increment:l;content:counter(l);font-family:var(--display);font-weight:800;font-size:18px;color:var(--verm);line-height:1}
.loopList b{color:var(--navy)}
.pairs{display:grid;gap:5px}
.pairs div{display:grid;gap:0;padding:6px 12px;border-radius:10px;background:var(--cream);border:1px solid var(--line)}
.pairs s{color:var(--stop);font-size:13px}
.pairs b{color:var(--navy);font-size:14.5px;line-height:1.3}
.checklist{display:grid;gap:5px}
.checklist label{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:center;padding:5px 12px;border-radius:11px;background:var(--cream);border:1px solid var(--line);cursor:pointer;font-size:14.5px;min-height:44px;line-height:1.3}
.checklist input{width:20px;height:20px;margin:0;accent-color:var(--go)}
.checklist label:has(input:checked){background:var(--go-bg)}
.checklist label:has(input:checked) span{text-decoration:line-through;color:var(--mute)}

/* practice */
.ownerq{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:end}
.ownerq svg{width:96px;height:auto}
.said{font-size:18px;line-height:1.4;font-weight:600;color:var(--navy);background:var(--cream);border:1.5px solid var(--sand3);border-radius:16px;border-bottom-left-radius:4px;padding:12px 14px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.opts button{border-radius:11px;border:1.5px solid var(--sand3);background:var(--cream);min-height:50px;font-family:var(--display);font-weight:800;font-size:17px;text-transform:uppercase;color:var(--navy);padding:4px}
.opts button.right{background:var(--go);border-color:var(--go);color:var(--cream)}
.opts button.wrong{background:var(--stop-bg);border-color:var(--stop);color:var(--stop)}
.ans{display:grid;gap:5px;font-size:15px}
.ans .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ans .hd b{font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase}
.bigscore{font-family:var(--display);font-weight:800;font-size:96px;line-height:.85;color:var(--verm);font-variant-numeric:tabular-nums}

/* field card */
.fc{background:var(--navy);color:var(--cream);border-radius:16px;padding:14px 16px;display:grid;gap:10px}
.fc h4{margin:0 0 3px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.06em;text-transform:uppercase;color:var(--verm)}
.fc ol,.fc ul{margin:0;padding-left:20px;display:grid;gap:2px;font-size:14.5px}
.src{font-size:13px;color:var(--mute)}
.src ul{margin:0;padding-left:18px;display:grid;gap:5px}

@media (min-width:760px){.card>.wrap{padding-block:26px 20px;gap:14px}.idea{font-size:18px}.cover-art svg{max-height:290px;width:auto;margin:0 auto}}
@media (max-height:640px){
  .card>.wrap{padding-block:10px 8px;gap:8px}
  .idea{font-size:15px}.t1{font-size:clamp(33px,9.5vw,50px)}.t2{font-size:clamp(26px,7.2vw,37px)}
  .box{padding:9px 12px}.opt{display:none!important}
  .cover-art svg{max-height:150px;width:auto;margin:0 auto}
  .who button{min-height:56px;padding:5px 12px}.who button .av{width:40px;height:40px;font-size:21px}
  .uq .big{font-size:24px}.uq dl div{font-size:13.5px}
  .quote{font-size:14.5px;line-height:1.55}.lpanel .q{font-size:13.5px}
  .silence{grid-template-columns:90px minmax(0,1fr)}.silence button,.silence svg{width:90px;height:90px}
  .loopArt{grid-template-columns:120px minmax(0,1fr)}.loopArt svg{width:120px;height:120px}
  .art.sm{max-height:74px}
  .copyable{max-height:96px}
  .traps>div{font-size:13.5px;padding:6px 11px}
  .acc summary{min-height:39px;padding:2px 12px}
  .checklist label{min-height:38px;padding:2px 12px;font-size:14px}
  .pocket div{font-size:12.7px}
  .cmp svg{max-height:96px}
  .talk{font-size:13.5px}
}
/* character motion */
.on .breathe{animation:breathe 3.4s ease-in-out infinite;transform-origin:0 0}
@keyframes breathe{50%{transform:scaleY(1.013)}}
.blink{transform-box:fill-box;transform-origin:center}
.on .blink{animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
.nod,.talkArm{transform-origin:0 0}
.on .nod{animation:nod 2.6s ease-in-out infinite}
@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(4deg)}}
.on .talkArm{animation:talkArm 1.5s ease-in-out infinite}
@keyframes talkArm{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(9deg)}}
.mouth{transform-box:fill-box;transform-origin:center}
.on .mouth{animation:mouth .26s ease-in-out infinite alternate}
@keyframes mouth{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.spin{transform-box:fill-box;transform-origin:center}
.on .spin{animation:spin var(--sd,3s) linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.t1 span:not(.w),.t2 span:not(.w){background-size:100% 30%}}

/* ===== v3 additions ===== */
.k{font-weight:700;text-decoration:underline;text-decoration-color:var(--verm);text-decoration-thickness:2px;text-underline-offset:3px}
.rule .k,.fc .k,.verdict .k{text-decoration-color:var(--gold)}
.lead{font-size:15.5px;line-height:1.45}
@media (max-height:640px){.lead{font-size:14.5px;line-height:1.4}}
/* gate: nudge + locked next */
[data-g]{position:relative}
.next span{font-size:clamp(15px,4.6vw,20px)}
.next.locked span{font-size:clamp(14px,4.1vw,17px)}
.next.unlock{animation:unl .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes unl{0%{transform:scale(.94)}50%{transform:scale(1.05)}100%{transform:none}}
.next{position:relative;overflow:hidden}
.next.unlock::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,244,222,.7) 50%,transparent 70%);animation:shine .8s ease-out forwards}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
/* how-it-works rows */
.how{display:grid;gap:6px}
.how div{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center;font-size:14.5px;line-height:1.35}
.how svg{width:30px;height:30px}
/* timeline box */
.tlBox{min-height:150px}
.tlBox .q{font-weight:600;font-style:italic}
.tlBox p{font-size:14px;line-height:1.42}
/* reveal study boxes */
.study{text-align:left;border:1.5px solid var(--sand3);background:var(--cream);border-radius:12px;padding:9px 12px;display:grid;gap:3px;font-size:14px;line-height:1.38;width:100%}
.study .sh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.study .sh b{font-family:var(--display);font-weight:800;font-size:16px;text-transform:uppercase;color:var(--navy)}
.study .more{font-family:var(--hand);font-weight:700;font-size:17px;color:var(--ember);white-space:nowrap}
.study .res{display:none;border-top:2px dashed var(--sand3);padding-top:5px;margin-top:2px}
.study.open .res{display:grid;gap:3px}
.study.open .more{display:none}
.study .you{color:var(--go);font-weight:700}
/* equation */
.eqn{display:grid;gap:6px;justify-items:center}
.eqrow{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:nowrap}
.eqrow i{font-style:normal;font-family:var(--display);font-weight:800;font-size:20px;color:var(--navy)}
.chip{border:2px solid var(--sand3);background:var(--cream);border-radius:10px;padding:5px 9px;min-height:40px;font-family:var(--display);font-weight:800;font-size:15px;line-height:1.05;text-transform:uppercase;color:var(--navy)}
.chip.up{border-color:var(--go)}.chip.down{border-color:var(--stop)}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--cream);border-color:var(--navy)}
.eqline{width:100%;height:10px}
.eqPanel{min-height:132px;font-size:14px;line-height:1.4}
.eqPanel .nm{font-family:var(--display);font-weight:800;font-size:19px;text-transform:uppercase}
.eqPanel .dir{font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
/* sliders */
.sl{display:grid;gap:1px;padding:5px 11px;border-radius:12px;background:var(--cream);border:1.5px solid var(--line)}
.sl .slt{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.sl .slt b{font-family:var(--display);font-weight:800;font-size:16px;text-transform:uppercase;color:var(--navy)}
.sl .slt small{font-size:12px;color:var(--mute)}
.sl input{width:100%;accent-color:var(--navy);margin:0;height:24px}
.alert{font-size:12.5px;font-weight:600;border-radius:7px;padding:2px 8px;line-height:1.3;transition:background .25s,color .25s}
.alert.g{background:var(--go-bg);color:var(--go)}.alert.a{background:var(--maybe-bg);color:var(--maybe)}.alert.r{background:var(--stop-bg);color:var(--stop)}
.alert.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.03)}}
.slgrid{display:grid;gap:6px}
/* talk reveal */
.talk .hide{display:none}.talk.open .hide{display:block}
/* visit bar */
.vbarArt{width:100%;height:auto;display:block}
.segBtns{display:grid;grid-template-columns:5fr 10fr 15fr 10fr;gap:4px}
.segBtns button{border:0;border-radius:9px;min-height:44px;font-family:var(--display);font-weight:800;font-size:14px;line-height:1;text-transform:uppercase;color:var(--cream);padding:3px 2px;display:grid;align-content:center;gap:2px}
.segBtns button small{font-weight:600;font-size:11.5px;opacity:.85}
.segBtns button[aria-pressed="true"]{outline:3px solid var(--navy);outline-offset:2px}
.p1{background:#2E6CCB}.p2{background:#2F7D52}.p3{background:#EE6A2C}.p4{background:#7A4FB0}
.partBox{min-height:150px;font-size:14px;line-height:1.4}
.partBox .nm{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;color:var(--navy);line-height:1}
/* phase header + question accordion */
.phHead{display:flex;align-items:center;gap:10px}
.phHead svg{width:44px;height:44px;flex:none}
.phHead .eyebrow{line-height:1.2}
.minibar{display:grid;grid-template-columns:5fr 10fr 15fr 10fr;gap:3px;margin-top:4px}
.minibar i{height:6px;border-radius:3px;background:var(--sand2)}
.minibar i.on{background:var(--verm)}
.goal{font-size:14.5px;line-height:1.4}
.qa{display:grid;gap:6px}
.qi{border-radius:12px;background:var(--cream);border:1.5px solid var(--sand3);overflow:hidden}
.qi>button{width:100%;text-align:left;border:0;background:transparent;padding:6px 12px;display:grid;gap:1px}
.qi .qn{display:flex;justify-content:space-between;gap:8px;font-family:var(--display);font-weight:800;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ember)}
.qi .qq{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.08;text-transform:uppercase;color:var(--navy)}
.qi .qw{font-size:13px;color:var(--mute);line-height:1.3}
.qi .qw b{color:var(--navy)}
.qi .qtap{font-family:var(--hand);font-weight:700;font-size:16px;letter-spacing:0;text-transform:none;color:var(--ember)}
.qi .qd{display:none;padding:0 12px 9px;gap:4px;font-size:13.5px;line-height:1.36}
.qi.open .qd{display:grid}
.qi.open .qtap{display:none}
.qi.open{border-color:var(--navy)}
.qd dt{font-family:var(--display);font-weight:800;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ember);display:inline;margin-right:5px}
.qd dd{margin:0;display:inline}
.qd div{line-height:1.36}
.qd .av dt{color:var(--stop)}
/* follow-up moves */
.moves{display:flex;flex-wrap:wrap;gap:6px}
.moves button{border-radius:999px;border:1.5px solid var(--navy);background:var(--cream);color:var(--navy);padding:6px 12px;min-height:38px;font-size:14px;font-weight:600}
.moves button[aria-pressed="true"]{background:var(--navy);color:var(--cream)}
.demo{display:grid;gap:6px;min-height:178px;align-content:start}
.demo .when{font-size:13.5px;color:var(--mute);line-height:1.35}
.demo .when b{color:var(--navy)}
.ring3{display:flex;align-items:center;gap:8px;justify-self:end;font-family:var(--hand);font-weight:700;font-size:18px;color:var(--ember)}

.stR{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12.5px}
.stR .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.stR .bar{height:8px;background:var(--sand);border-radius:4px;overflow:hidden}
.stR .bar i{display:block;height:100%;background:var(--verm);border-radius:4px}
.stR .s{font-variant-numeric:tabular-nums;color:var(--navy);font-weight:600;white-space:nowrap}
.spanel .ph{display:flex;justify-content:space-between;align-items:center;gap:10px}.stG div span{font-family:var(--body);font-weight:400;font-size:12px;color:var(--mute);text-transform:none;letter-spacing:0}.stG b{font-family:var(--body);text-transform:none;font-weight:700}

/* ===== AI safety guide additions ===== */
.scene{display:grid;gap:8px}
.scv{border-radius:14px;overflow:hidden;border:1.5px solid var(--sand3);background:var(--sand);box-shadow:0 2px 0 rgba(14,31,63,.08)}
.scv svg{display:block;width:100%;height:auto}
.scap{gap:3px;padding:9px 13px;min-height:88px;align-content:start}
.scap .sstep{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ember)}
.scap .stxt{font-size:15.5px;line-height:1.4;color:var(--ink)}
.sctl{display:flex;gap:8px;align-items:center}
.sctl .snext{flex:1;justify-content:center;justify-self:auto;position:relative}
.sctl .replay{justify-self:auto}
.mtabs button{font-size:15px}
.mtabs button[data-mode="without"][aria-selected="true"]{background:var(--stop)}
.mtabs button[data-mode="with"][aria-selected="true"]{background:var(--go)}
.mtabs button{position:relative}
.on .halo{animation:halo 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes halo{50%{opacity:.12}}
.techn{font-size:13.5px;line-height:1.35}.techn b{color:var(--navy)}
.heads{display:grid;gap:6px}
.head{position:relative}
.head .hl{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.08;text-transform:uppercase;color:var(--navy)}
.stats4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.stat{position:relative;text-align:left;border:1.5px solid var(--sand3);background:var(--cream);border-radius:12px;padding:8px 11px;display:grid;gap:2px;align-content:start}
.stat b{font-family:var(--display);font-weight:800;font-size:40px;line-height:.95;color:var(--verm);font-variant-numeric:tabular-nums}
.stat .st1{font-size:13.5px;font-weight:600;color:var(--navy);line-height:1.25}
.stat .st2{display:none;font-size:13px;line-height:1.3;border-top:2px dashed var(--sand3);padding-top:4px;margin-top:2px}
.stat.open .st2{display:block}
.stat small{font-size:11.5px;color:var(--mute)}
.worries .sig{position:relative}
.sigEx .row b{font-family:var(--display);font-weight:800;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ember);margin-right:6px}
.flips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.fl{position:relative;text-align:left;border:1.5px solid var(--sand3);background:var(--cream);border-radius:12px;padding:8px 11px;display:grid;gap:2px;min-height:58px;align-content:start}
.fl b{font-family:var(--display);font-weight:800;font-size:17px;line-height:1.05;text-transform:uppercase;color:var(--navy)}
.fl .tap{font-family:var(--hand);font-weight:700;font-size:16px;color:var(--ember)}
.fl .bk{display:none;font-size:13.5px;line-height:1.3;color:var(--cream)}
.fl.open{background:var(--navy);border-color:var(--navy)}
.fl.open b{color:var(--gold)}.fl.open .tap{display:none}.fl.open .bk{display:block}
.chain button{position:relative}
.chain button.sel{border-color:var(--navy);background:#fff}
.chainBox,.stgbox{display:grid;gap:5px;font-size:14px;line-height:1.38;min-height:150px;align-content:start}
.mapg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mapg>div{display:grid;gap:5px;align-content:start}
.mh{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:.06em;text-transform:uppercase;line-height:1.05}
.mh small{display:block;font-family:var(--hand);font-weight:700;font-size:16px;letter-spacing:0;text-transform:none}
.mh.fr{color:var(--stop)}.mh.bk{color:var(--go)}
.mi{position:relative;min-height:44px}
.mi b{font-size:14px!important}
.rchips{display:flex;flex-wrap:wrap;gap:6px}
.rchip{border-radius:999px;border:1.5px solid var(--navy);background:var(--cream);color:var(--navy);padding:5px 11px;min-height:36px;font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.rchip:hover{background:var(--navy);color:var(--cream)}
.mission.ask{border-color:var(--ultra);background:#EEF3FB}
.mission.ask .handnote{color:var(--ultra)}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.two button{min-height:56px;font-size:20px;position:relative}
.gq{grid-template-columns:84px minmax(0,1fr);align-items:center}
.gq .gi svg{width:84px;height:84px}
.ownerq>div:first-child svg{width:96px;height:auto}
.qd .bub{max-width:100%}
.facts{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14.5px}
.acc .body p{font-size:14.5px;line-height:1.42}
.checks3>div p{font-size:14.5px}
.checks3 .k{text-decoration-color:var(--gold)}
@media (max-height:640px){.scap{min-height:76px}.scap .stxt{font-size:14.5px}.stat b{font-size:32px}.gq .gi svg{width:64px;height:64px}.gq{grid-template-columns:64px minmax(0,1fr)}}

</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <div class="wrap">
      <button class="menuBtn" id="menuBtn" type="button" aria-haspopup="dialog" aria-controls="sheet"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>Stops</button>
      <div class="where" aria-live="polite"><b id="whereName">Welcome</b><small id="whereSub">AI Safety Field Guide</small></div>
      <div class="me"><span class="count" id="count"></span><span class="avatar" id="avatar" hidden></span></div>
    </div>
    <div class="wrap"><div class="segs" id="segs"></div></div>
  </header>

  <main class="stage" id="stage">
    <div class="tex"></div>

    <div class="ghostHand" id="ghost" aria-hidden="true"><svg viewBox="0 0 48 56"><path d="M18 30 V8 q0 -5 5 -5 t5 5 v16 l2 -1 q4 -1 5 3 l1 1 q4 -1 5 3 l1 1 q4 -1 4 4 v10 q0 12 -12 12 h-6 q-7 0 -11 -6 l-9 -13 q-2 -4 2 -6 q3 -1 5 2z" fill="#FFF4DE" stroke="#142B55" stroke-width="2.6" stroke-linejoin="round"/></svg><i></i></div>
    <div class="morehint" id="morehint" hidden><span>scroll a little ↓</span></div>
  </main>
  <footer class="bottom">
    <div class="wrap">
      <button class="back" id="prev" type="button" aria-label="Previous card"><svg viewBox="0 0 20 20"><path d="M12 4 6 10l6 6" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="next" id="next" type="button"><span id="nextLabel">Next</span><svg class="arr" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="m8 4 6 6-6 6" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </footer>
</div>

<div class="stats" id="stats" role="dialog" aria-modal="true" aria-labelledby="statsTitle" hidden>
  <div class="spanel">
    <div class="ph"><h2 id="statsTitle">Team stats</h2><button class="close" id="statsClose" type="button" aria-label="Close">×</button></div>
    <p class="mute" id="statsSub">Only you can see this.</p>
    <div id="statsBody"><p class="mute">Loading…</p></div>
  </div>
</div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="panel">
    <div class="ph"><h2 id="sheetTitle">The route</h2><button class="close" id="sheetClose" type="button" aria-label="Close">×</button></div>
    <div class="stops" id="stopList"></div>
    <div class="sheetBtns"><button class="switch" id="switchUser" type="button">Switch person</button><button class="switch statsBtn" id="statsBtn" type="button" hidden>Team stats</button></div>
  </div>
</div>

<script>
(function(){
var P={sand:'#F3DDB2',sand2:'#E7C690',sand3:'#D7AA68',cobalt:'#2E6CCB',sky:'#5B93DE',ultra:'#1F4C9C',navy:'#142B55',ink:'#0E1F3F',verm:'#EE6A2C',ember:'#C64A1C',gold:'#F2B33D',cream:'#FFF4DE',road:'#1A3A73'};
var SK=['#F1C7A1','#D9A074','#A9704A','#6F4732'];
var HR={dark:'#2A1C16',brown:'#5B3A24',gray:'#C2B8AA',black:'#17110E'};
var SH='rgba(14,31,63,.22)';
var DF="'Barlow Condensed','Arial Narrow',Impact,sans-serif", HF="Caveat,'Comic Sans MS',cursive";

/* ---------- primitives ---------- */
function rect(x,y,w,h,f,rx,ex){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'"'+(rx?' rx="'+rx+'"':'')+' fill="'+f+'"'+(ex||'')+'/>';}
function hl(x,y,lines,o){o=o||{};var fs=o.fs||84,col=o.col||P.navy,em=o.em||P.verm,lh=o.lh||fs*0.96,an=o.anchor||'start';
  var s='<text class="a" style="--d:'+(o.d||0)+'s" x="'+x+'" y="'+y+'" font-family="'+DF+'" font-weight="800" font-size="'+fs+'" fill="'+col+'" text-anchor="'+an+'" letter-spacing="1">';
  lines.forEach(function(ln,i){var parts=ln.split('*');s+='<tspan x="'+x+'" dy="'+(i?lh:0)+'">'+parts.map(function(p,j){return j%2?'<tspan fill="'+em+'">'+p+'</tspan>':p;}).join('')+'</tspan>';});
  return s+'</text>';}
function hand(x,y,lines,o){o=o||{};var fs=o.fs||32,col=o.col||P.ink,lh=o.lh||fs*1.08,an=o.anchor||'start';
  var s='<text class="a" style="--d:'+(o.d||0)+'s" x="'+x+'" y="'+y+'" font-family="'+HF+'" font-weight="700" font-size="'+fs+'" fill="'+col+'" text-anchor="'+an+'">';
  lines.forEach(function(ln,i){s+='<tspan x="'+x+'" dy="'+(i?lh:0)+'">'+ln+'</tspan>';});return s+'</text>';}
function kick(x,y,t,o){o=o||{};return '<text class="a" style="--d:'+(o.d||0)+'s" x="'+x+'" y="'+y+'" font-family="'+DF+'" font-weight="600" font-size="'+(o.fs||26)+'" letter-spacing="5" fill="'+(o.col||P.ember)+'" text-anchor="'+(o.anchor||'start')+'">'+t+'</text>';}
function arrow(x1,y1,x2,y2,col,bend,d){var mx=(x1+x2)/2+(bend||0),my=(y1+y2)/2-Math.abs(bend||0)*0.4;var ang=Math.atan2(y2-my,x2-mx);
  var h1x=x2-15*Math.cos(ang-0.5),h1y=y2-15*Math.sin(ang-0.5),h2x=x2-15*Math.cos(ang+0.5),h2y=y2-15*Math.sin(ang+0.5);
  return '<g class="a" style="--d:'+(d||0)+'s" fill="none" stroke="'+col+'" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M'+x1+','+y1+' Q'+mx+','+my+' '+x2+','+y2+'"/><path d="M'+h1x.toFixed(1)+','+h1y.toFixed(1)+' L'+x2+','+y2+' L'+h2x.toFixed(1)+','+h2y.toFixed(1)+'"/></g>';}
function stamp(cx,cy,r,num,col,d){return '<g class="pop" style="--d:'+d+'s"><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+P.cream+'"/><circle cx="'+cx+'" cy="'+cy+'" r="'+(r-9)+'" fill="none" stroke="'+col+'" stroke-width="3" stroke-dasharray="5 7"/><text x="'+cx+'" y="'+(cy+r*0.22)+'" text-anchor="middle" font-family="'+DF+'" font-weight="800" font-size="'+(r*0.66)+'" fill="'+col+'">'+num+'</text></g>';}
function cloud(x,y,s,cls){return '<g class="'+(cls||'drift')+'"><g transform="translate('+x+','+y+') scale('+s+')"><g fill="'+P.cream+'"><ellipse cx="0" cy="0" rx="92" ry="32"/><ellipse cx="66" cy="-20" rx="68" ry="40"/><ellipse cx="140" cy="2" rx="82" ry="28"/></g><path d="M-70,6 h110 M40,-14 h80 M90,12 h120" stroke="'+P.sky+'" stroke-width="3" opacity=".35" stroke-linecap="round"/></g></g>';}
function rng(seed){var s=seed;return function(){s=(s*9301+49297)%233280;return s/233280;};}
function snow(n,seed){var r=rng(seed),g='';for(var i=0;i<n;i++){var x=(r()*1640-20).toFixed(0),y=(r()*900).toFixed(0),rad=(1.8+r()*4).toFixed(1);g+='<circle class="flake" cx="'+x+'" cy="'+y+'" r="'+rad+'" fill="'+P.cream+'" opacity="'+(0.6+r()*0.4).toFixed(2)+'" style="animation-duration:'+(5+r()*6).toFixed(1)+'s;animation-delay:-'+(r()*10).toFixed(1)+'s"/>';}return g;}
function leaf(x,y,s,rot,col,op){return '<g transform="translate('+x+','+y+') rotate('+rot+') scale('+s+')" opacity="'+(op||1)+'"><path d="M0,0 C10,-20 30,-22 28,-42 C46,-40 52,-58 46,-72 C62,-70 72,-88 62,-102 C76,-108 78,-126 68,-138 C58,-130 50,-144 38,-136 C34,-152 18,-154 12,-140 C2,-152 -14,-146 -12,-130 C-26,-134 -36,-120 -28,-106 C-42,-100 -42,-82 -30,-74 C-42,-62 -36,-46 -22,-46 C-28,-30 -18,-14 0,0Z" fill="'+col+'"/><path d="M0,0 L18,-130" stroke="'+P.sand+'" stroke-width="3" opacity=".25" fill="none"/></g>';}
function gear(cx,cy,r,col){var t='';for(var i=0;i<12;i++){t+='<rect x="-14" y="'+(-r-22)+'" width="28" height="40" rx="5" fill="'+col+'" transform="rotate('+(i*30)+')"/>';}
  return '<g transform="translate('+cx+','+cy+')"><g class="spin" style="--sd:22s">'+t+'<circle r="'+r+'" fill="'+col+'"/><circle r="'+(r*0.35)+'" fill="'+P.ultra+'"/></g></g>';}

/* ---------- character system ---------- */
function leg(hx,cls,pants,shoe,shade){return '<g transform="translate('+hx+',-140)"><g class="'+cls+'"><rect x="-12" y="-6" width="24" height="126" rx="11" fill="'+pants+'"/>'+(shade?'<rect x="-12" y="-6" width="24" height="126" rx="11" fill="'+SH+'"/>':'<path d="M-9,4 V108" stroke="'+P.cream+'" stroke-width="2.4" opacity=".4" stroke-linecap="round"/>')+'<path d="M-14,114 h28 q19,0 19,13 v13 h-47z" fill="'+shoe+'"/></g></g>';}
function arm(sx,sy,a,e,col,fore,skin,hold,cls,back){
  return '<g transform="translate('+sx+','+sy+')"><g class="'+(cls||'')+'"><g transform="rotate('+(-a)+')">'+
  '<rect x="-11" y="-8" width="22" height="62" rx="11" fill="'+col+'"/>'+(back?'<rect x="-11" y="-8" width="22" height="62" rx="11" fill="'+SH+'"/>':'')+
  '<g transform="translate(0,50) rotate('+(-e)+')"><rect x="-10" y="-8" width="20" height="56" rx="10" fill="'+fore+'"/>'+(back?'<rect x="-10" y="-8" width="20" height="56" rx="10" fill="'+SH+'"/>':'')+
  '<circle cx="0" cy="50" r="11.5" fill="'+skin+'"/>'+(hold?'<g transform="translate(0,50) rotate('+(a+e)+')">'+hold+'</g>':'')+'</g></g></g></g>';}
var HOLD={
  phone:'<rect x="-8" y="-19" width="16" height="28" rx="3" fill="'+P.ink+'"/><rect x="-6" y="-16" width="12" height="18" rx="1.5" fill="'+P.sky+'"/>',
  notebook:'<g transform="rotate(-8)"><rect x="-6" y="-38" width="42" height="50" rx="3" fill="'+P.verm+'"/><rect x="-1" y="-34" width="33" height="42" fill="'+P.cream+'"/><path d="M4,-24h23M4,-15h23M4,-6h14" stroke="'+P.ultra+'" stroke-width="2.6"/></g>',
  pen:'<rect x="-3" y="-28" width="6" height="28" rx="3" fill="'+P.navy+'" transform="rotate(28)"/>',
  folder:'<rect x="-4" y="-42" width="58" height="42" rx="4" fill="'+P.verm+'"/><rect x="3" y="-34" width="42" height="6" rx="3" fill="'+P.cream+'"/><rect x="3" y="-24" width="28" height="5" rx="2.5" fill="'+P.cream+'" opacity=".8"/>',
  wrench:'<path d="M-4,-2 L-4,-40 q-10,-4 -8,-14 l6,6 l8,-2 l2,-8 l-6,-6 q12,-2 14,8 L4,-38 L4,-2z" fill="'+P.sand3+'"/>'
};
function person(o){
  var x=o.x,y=o.y,s=o.s||1,fl=o.flip?-1:1,skin=o.skin||SK[0],top=o.top||P.ultra,pants=o.pants||P.navy,shoe=o.shoe||P.ink;
  var dy=o.sit?44:0,up=o.jacket||top,fore=o.rolled?skin:up;
  var legs=o.sit?
    '<rect x="-32" y="-112" width="84" height="27" rx="13" fill="'+pants+'"/><rect x="-32" y="-112" width="84" height="27" rx="13" fill="'+SH+'"/>'+
    '<rect x="36" y="-102" width="24" height="94" rx="11" fill="'+pants+'"/><rect x="36" y="-102" width="24" height="94" rx="11" fill="'+SH+'"/>'+
    '<rect x="-16" y="-106" width="84" height="27" rx="13" fill="'+pants+'"/><rect x="51" y="-98" width="24" height="90" rx="11" fill="'+pants+'"/>'+
    '<path d="M32,-14 h30 q17,0 17,10 v4 h-47z" fill="'+shoe+'"/><path d="M47,-14 h30 q17,0 17,10 v4 h-47z" fill="'+shoe+'"/>'
    : leg(-15,'legB',pants,shoe,true)+leg(15,'legA',pants,shoe,false);
  var torso='<rect x="-10" y="-274" width="20" height="24" fill="'+skin+'"/>'+
    '<path d="M-41,-236 Q-43,-256 -26,-258 L26,-258 Q43,-256 41,-236 L36,-140 L-36,-140 Z" fill="'+top+'"/>';
  if(o.jacket){torso+='<path d="M-41,-236 Q-43,-256 -26,-258 L-8,-258 L-4,-140 L-36,-140Z" fill="'+o.jacket+'"/><path d="M8,-258 L26,-258 Q43,-256 41,-236 L36,-140 L4,-140Z" fill="'+o.jacket+'"/>';}
  if(o.vest){torso+='<path d="M-39,-238 Q-40,-254 -26,-256 L-6,-256 L-3,-146 L-36,-146Z" fill="'+o.vest+'"/><path d="M6,-256 L26,-256 Q40,-254 39,-238 L36,-146 L3,-146Z" fill="'+o.vest+'"/>';}
  if(o.apron){torso+='<path d="M-28,-212 h56 l7,74 h-70z" fill="'+o.apron+'"/>';}
  torso+='<path d="M10,-258 L26,-258 Q43,-256 41,-236 L36,-140 L8,-140 Z" fill="'+SH+'"/>'+
    '<path d="M-39,-234 L-34,-148" stroke="'+P.cream+'" stroke-width="3" opacity=".55" stroke-linecap="round" fill="none"/>'+
    '<rect x="-36" y="-150" width="72" height="11" rx="3" fill="'+P.ink+'" opacity=".42"/>';
  if(o.patch){torso+='<circle cx="-20" cy="-222" r="8" fill="'+P.verm+'"/><path d="M-20,-230 a8,8 0 0 1 0,16z" fill="'+P.cobalt+'"/>';}
  if(o.zip){torso+='<rect x="-16" y="-266" width="32" height="14" rx="5" fill="'+top+'"/><path d="M0,-266 V-226" stroke="'+P.cream+'" stroke-width="3.4" stroke-linecap="round"/>';}
  if(o.collar){torso+='<path d="M-13,-260 L0,-244 L13,-260" fill="'+o.collar+'"/><path d="M0,-244 V-150" stroke="'+P.sand3+'" stroke-width="2" opacity=".6"/>';}
  if(o.bowtie){torso+='<path d="M-11,-256 l11,7 l11,-7 v14 l-11,-7 l-11,7z" fill="'+P.verm+'"/>';}
  var hc=o.hair||HR.dark,hairBack='',hairFront='';
  switch(o.hairStyle){
    case 'curly':hairFront='<g fill="'+hc+'"><circle cx="-14" cy="-302" r="12"/><circle cx="-2" cy="-314" r="13"/><circle cx="12" cy="-316" r="11"/><circle cx="23" cy="-306" r="9"/><circle cx="-19" cy="-288" r="9"/></g>';break;
    case 'long':hairBack='<path d="M-22,-300 Q-32,-262 -20,-232 L8,-240 Q-4,-268 0,-300Z" fill="'+hc+'"/>';hairFront='<path d="M-22,-286 Q-24,-321 2,-321 Q25,-321 27,-300 Q10,-302 0,-308 Q-12,-298 -22,-286Z" fill="'+hc+'"/>';break;
    case 'bald':hairFront='<path d="M-21,-280 Q-24,-302 -12,-312 L-8,-304 Q-16,-296 -15,-280Z" fill="'+hc+'"/>';break;
    default:hairFront='<path d="M-21,-282 Q-26,-319 0,-321 Q23,-322 27,-298 Q14,-306 4,-304 Q-8,-303 -12,-292 Q-16,-284 -21,-282Z" fill="'+hc+'"/>';
  }
  var face='<ellipse cx="2" cy="-290" rx="23" ry="27" fill="'+skin+'"/><ellipse cx="-17" cy="-288" rx="5" ry="7" fill="'+skin+'"/>'+
    '<path d="M2,-317 Q-21,-316 -21,-290 Q-21,-266 2,-263 Q-9,-290 2,-317Z" fill="'+SH+'"/>';

var RULES=[
{n:1,scene:'r1',title:"The helper who talks to strangers never holds the keys",tech:"Separation of duties: split “reads untrusted input” from “takes real actions.”",
 say:"Your AI receptionist can answer the phone and book the calendar. It can't refund money, change your website or touch your bank. Those go through a separate setup, or through you.",
 pic:"Your CSR answers every call, including the scammers. You'd never hand her the company checkbook and the master key to the parts room on top of that. Same idea.",
 hist:["Old-school bookkeeping","Accountants have always split the person who writes checks from the person who reconciles the bank statement. Auditors call it “separation of duties.” It's one of the oldest anti-fraud controls there is: no single person can both open the door and walk out with the money."],
 why:"In EchoLeak (2025), one AI read outside email AND could see the company's private files, so a stranger's email turned it into a leak. AI still can't reliably tell an instruction from ordinary text: OWASP ranks prompt injection the #1 AI risk in both its 2025 and 2026 lists. So we don't count on the AI saying no. We make sure the AI that reads strangers has nothing worth stealing.",
 we:["Front-desk AI (calls, chat, email) can read and reply, nothing more","Money, website and customer-database changes run in a separate setup or need your tap","Anything the front desk can't handle gets handed to a person"],
 ask:"Who answers your phones? Do they also sign the checks?"},
{n:2,scene:'r2',title:"Give the AI a one-door key, never the master ring",tech:"Least privilege: narrowly scoped API keys and logins, removed when the job ends.",
 say:"Every AI tool we set up gets its own key that does one job, like “save blog drafts.” If anything goes wrong, the damage stops at that one door. When a project ends, we shut the key off.",
 pic:"You give a new apprentice the key to one van, not the ring that opens every truck, the shop and the supply cage.",
 hist:["Hotel keycards, 1970s onward","Hotels used to run on metal master keys. One lost key meant rekeying the whole building. Programmable keycards changed that: each card opens one room for one stay, then stops working. A scoped, expiring AI key works the same way."],
 why:"In Clinejection (Feb 2026), one stolen key could publish real software because it worked for both test builds and real releases. In the Amazon Q incident (July 2025), reports say an outsider was handed far more access than a stranger should ever get. Big keys turned small slips into big ones. OWASP calls this “Excessive Agency” (LLM06): an AI with more power than its job needs.",
 we:["One key per tool, per job, per client","Keys can create drafts, not delete the site or move money","Old keys removed when a project ends"],
 ask:"How many keys does a first-week tech get?"},
{n:3,scene:'r3',title:"AI drafts. You sign.",tech:"Human-in-the-loop approval for anything public, paid or irreversible.",
 say:"The AI writes the quote, the email, the post. Anything that's public, costs money or can't be undone waits for your tap. Ten seconds of “looks right?” keeps you in charge.",
 pic:"Your tech writes up the estimate on site, but you sign off on the big jobs before the customer sees the number.",
 hist:["The two-person rule","Bank vaults with dual control and missile launch crews share one rule: some actions need a second set of eyes. That's not because people are bad. One person, or one machine, can be fooled. An approval step is a cheap second set of eyes."],
 why:"Filters fail. EchoLeak walked straight past Microsoft's purpose-built prompt-injection filters (called XPIA classifiers) and its link blockers. When the clever defenses miss, a person glancing at “Send $18,400 refund to a new account?” does not.",
 we:["Approve buttons for publishing, payments, domain changes, client go-live and new installs","Approvals sent to your phone","Routine drafts flow freely; only the irreversible stuff waits"],
 ask:"Which jobs do you personally sign off on before the customer sees the price?"},
{n:4,scene:'r4',title:"Order the exact part number, not “whatever's newest”",tech:"Version pinning; deliberate, reviewed updates instead of automatic ones.",
 say:"Your system runs on exact, tested versions of its software. Updates happen on purpose, after we check what changed, not automatically at 2 a.m.",
 pic:"You spec the exact compressor model on the job. You don't tell the supply house “send whatever just came in” and install it unseen.",
 hist:["Tylenol, 1982","After someone tampered with Tylenol bottles on Chicago-area store shelves in 1982, killing seven people, drug makers adopted tamper-evident seals. The lesson: what arrives in a trusted brand's box isn't automatically safe. Check the seal before it goes in."],
 why:"In March 2026, poisoned versions of LiteLLM, an AI connector downloaded about 95 million times a month, were published under the real name. Systems set to grab the newest version pulled in password-stealing malware automatically. Systems locked to the last clean version (1.82.6) were untouched.",
 we:["Every tool locked to a specific version","A regular, deliberate update window with a quick check of what changed","Urgent security fixes applied on purpose, the same day"],
 ask:"Would you install a part that showed up unannounced, without checking the model number?"},
{n:5,scene:'r5',title:"Keys live in the safe, not on the dashboard",tech:"Secrets management: a password vault; no keys in chats, docs or code files.",
 say:"Passwords and access keys for your business live in an encrypted vault, not pasted into chats, docs or emails. If a computer ever gets infected, there's nothing lying around to grab.",
 pic:"Customer lockbox codes go in the office safe, not on a sticky note on the truck dashboard where anyone looking in the window can read them.",
 hist:["The key under the doormat","Burglars have always checked the doormat, the flowerpot and the top of the door frame first. Modern malware does the same thing: it searches computers for the files and settings where people leave passwords."],
 why:"The LiteLLM malware was built to hunt for exactly this: SSH keys, AI service keys, cloud logins and crypto wallets saved on the machine. Keys kept in a vault and filled in only when needed weren't sitting there to grab.",
 we:["Team and client credentials in a password vault (like 1Password)","Never in chat history, shared docs or code","Two-factor login turned on everywhere it's offered"],
 ask:"Where do you keep customer lockbox and gate codes today?"},
{n:6,scene:'r6',title:"Strangers' gadgets don't get wired into the main panel",tech:"Don't run untrusted installs as admin; use a sandbox or a reputable hosted tool.",
 say:"We don't install random add-ons or scripts on the computers that run your business. If we need to try something new, we test it in a separate space first.",
 pic:"A guy shows up with a “free energy-saver gizmo” and wants to wire it into your main panel. You'd bench-test it first, if you let it in at all.",
 hist:["The Trojan horse","Troy's walls were never breached. The Trojans wheeled the horse inside themselves, because it looked like a gift. Most software attacks still work that way: someone with the keys installs the “gift” on purpose."],
 why:"In Clinejection, an AI bot ran an install command pointing at a look-alike address (“glthub” instead of “github”). In LiteLLM, a normal install pulled in a thief. Anything installed under your main login can reach everything that login can: saved passwords, browser logins, client files.",
 we:["Prefer reputable hosted tools with their own accounts","New scripts tested on a separate account or machine first","Admin logins used for admin tasks only"],
 ask:"Would you let a stranger wire something into your panel without testing it?"},
{n:7,scene:'r7',title:"When the meter spikes, cut the power",tech:"Usage and billing alerts, plus fast, accurate key revocation.",
 say:"We set alarms on the AI and cloud accounts. If spending or activity suddenly jumps, we shut off that key in minutes and issue a fresh one. Speed beats perfection.",
 pic:"A breaker trips before the wire melts. It doesn't figure out why first. It cuts the power, then you troubleshoot.",
 hist:["The fuse and the breaker","Since the early days of electric wiring, fuses and breakers have protected buildings with one simple idea: watch for too much, and cut it off automatically. Credit-card fraud alerts work the same way today."],
 why:"Stolen AI keys often show up first as a strange bill. Shutting keys off works: Amazon revoked the credentials used in the Q incident. And kill the RIGHT key: in Clinejection, the team rotated keys but deleted the wrong one, and the attacker used the stolen key that was left eight days later.",
 we:["Spending caps and alerts on AI, cloud and automation accounts","A key list (which key does what) so we kill the right one","Revoke first, investigate second"],
 ask:"How fast would you notice if your fuel cards started getting used at 3 a.m.?"},
{n:8,scene:'r8',title:"Pressure-test before you charge the system",tech:"A staging (test) copy before anything reaches production.",
 say:"Changes to your website, phone scripts or SEO go to a test copy first. We check it, you can check it, and only then does it go live.",
 pic:"You nitrogen pressure-test the lines before you release refrigerant. Find the leak on the test, not on the customer's call.",
 hist:["Test flights","The Wright brothers flew gliders for three seasons, 1900 to 1902, before adding an engine. Aviation, bridges and theater all rehearse before the real thing. AI changes deserve the same."],
 why:"AI output can be wrong even without a hacker: a made-up phone number, a wrong price, an odd sentence. If a trick or a glitch hits the test copy, the live business never sees it.",
 we:["A test (staging) copy of the website for AI edits","Phone and voice scripts tried on internal calls before customers hear them","One-click roll back to the last good version"],
 ask:"Do you pressure-test before you charge a system? Same idea."},
{n:9,scene:'r9',title:"Every client gets their own lockbox",tech:"Per-client access isolation, and removing access when the work ends.",
 say:"Your business has its own separate access, folders and keys. Nothing is shared with our other clients. When the work ends, we remove our access.",
 pic:"You'd never use one lockbox code for every customer's house. One leaked code shouldn't open the whole neighborhood.",
 hist:["Target, 2013: it started with an HVAC vendor","Hackers stole login credentials from a Pennsylvania HVAC contractor that did business with Target, used them to get into Target's network, and ended up with about 40 million card numbers. The vendor's access was meant for billing and project paperwork. Every vendor login is a door."],
 why:"Verizon's 2025 breach report found third parties were involved in 30% of breaches, double the year before. StarWell is a vendor too. We hold ourselves to the standard we'd want from anyone with keys to your business.",
 we:["Separate logins, folders and keys for each client","No shared “team password” across clients","Access removed when a project ends, and we confirm it with you"],
 ask:"If one customer's lockbox code leaked, would it open anyone else's house?"},
{n:10,scene:'r10',title:"Write the 5-line fire drill before the fire",tech:"An incident-response plan, kept off the systems it protects, and practiced once.",
 say:"We keep a short written plan for “something looks wrong”: shut off keys, change passwords, tell you, restore from backup, write down what happened. We've practiced it, so nobody's guessing.",
 pic:"Lockout/tagout: same steps, same order, every time, so nobody gets hurt in the rush.",
 hist:["The pilot's checklist, 1935","After an experienced crew crashed Boeing's new bomber prototype by missing one step, pilots started flying with checklists. They weren't bad pilots. Pressure makes everyone forget. A plan on paper turns panic into steps."],
 why:"Panic makes it worse. Clinejection's team rotated keys in a hurry and deleted the wrong one. Keep the plan somewhere a hacked computer can't touch: paper, or a separate account.",
 we:["A five-line kill plan for each client","Backups we've actually restored from","One practice run, so it's muscle memory"],
 ask:"If something looked wrong tonight, who would you call first?"}
];

var STORIES=[
{id:'echoleak',n:'01',date:'June 2025',who:'Microsoft 365 Copilot',title:"EchoLeak: the email the AI obeyed",
 plain:"A stranger emails a business that uses Microsoft's AI assistant. The email looks normal, but it's worded so the AI treats it as instructions. Later, when someone asks the AI an everyday question, the AI pulls in that email, follows the hidden steps, and quietly sends private company information out through a link. Nobody clicked anything.",
 pic:"A note slipped into the day's mail, addressed “to whoever sorts this.” Your office helper sorts the mail, reads it, and does what it says, including copying the filing cabinet.",
 shop:"Any AI that reads your inbox, web forms or reviews is reading text strangers wrote. If that same AI can see your customer files, a stranger can try to steer it.",
 facts:["Found by Aim Security; reported to Microsoft in January 2025, made public June 2025","Tracked as CVE-2025-32711 and rated 9.3 out of 10 for severity","Slipped past Microsoft's dedicated prompt-injection filters","Fixed by Microsoft before the details went public"],rules:[1,2,3]},
{id:'amazonq',n:'02',date:'July 2025',who:'Amazon Q (VS Code extension)',title:"Amazon Q: a “wipe” command in the official update",
 plain:"Amazon Q is an AI coding helper that runs inside developers' code editors. An outsider got a planted instruction into Amazon's own code, and it shipped in an official update. The instruction told the AI to “clean up” the computer by deleting files and cloud accounts. It only failed because the attacker wrote it wrong.",
 pic:"Someone slips a bad page into the manufacturer's install manual. Every tech who follows the manual that week follows the bad page too.",
 shop:"The tools you trust update themselves. If a trusted supplier gets compromised, the bad update arrives with their logo on it. Your protection is how much power the tool has in your business, and whether updates install automatically.",
 facts:["Installed roughly 950,000 times","Planted July 13, 2025; shipped in version 1.84.0 on July 17","Reports say a misconfigured access setup gave the outsider far too much power","Amazon says no customer resources were affected; it revoked the credentials and released 1.85.0"],rules:[2,4,6]},
{id:'cline',n:'03',date:'Dec 2025 – Feb 2026',who:'Cline (AI coding tool)',title:"Clinejection: a bug report that hijacked an AI bot",
 plain:"Cline, a popular AI coding tool, put an AI bot in charge of sorting bug reports from the public. An attacker wrote a bug report whose title was really an instruction. The bot followed it, which let the attacker steal the keys used to publish Cline's software. A fake version later shipped to thousands of computers.",
 pic:"Your suggestion box is read by an apprentice who also carries the key to the parts warehouse. One “suggestion” says: “Also, leave the warehouse key under the mat.”",
 shop:"A bot that reads public input (reviews, forms, emails) should never carry keys that matter. And when you change the locks, change the right one.",
 facts:["AI triage bot added December 2025; the flaw was made public February 9, 2026","The bot installed code from a look-alike address (“glthub” instead of “github”)","One key worked for both test builds and real releases","During cleanup the wrong key was deleted; a fake Cline 2.3.0 shipped February 17, 2026, reportedly reaching about 4,000 machines"],rules:[1,2,7,10]},
{id:'litellm',n:'04',date:'March 2026',who:'LiteLLM (AI connector software)',title:"LiteLLM: poison in the real supplier's box",
 plain:"LiteLLM is popular software that lets apps plug into many AI brands. Attackers stole the publisher's login and released two poisoned versions under the real name. Any system set to “always grab the latest” installed malware that hunted for passwords and keys.",
 pic:"Counterfeit parts shipped in the real supplier's boxes. Shops with a standing order for “whatever's newest” got them overnight. Shops that ordered an exact model number didn't.",
 shop:"AI automations are built from parts like this. Locked versions and a password vault were the difference between “not affected” and “change every password we own.”",
 facts:["About 95 million downloads a month","Poisoned versions 1.82.7 and 1.82.8 published March 24, 2026; last clean version 1.82.6","Stole SSH keys, AI and cloud logins and crypto wallets","Publishing login likely stolen through an earlier hack of a security tool (Trivy)"],rules:[4,5,6,7]}
];

  BUBS.forEach(function(q){if(bx<q.x+q.w+6&&bx+w+6>q.x&&by<q.y+q.h+6&&by+h+6>q.y)by=Math.max(6,q.y-h-8);});BUBS.push({x:bx,y:by,w:w,h:h});var tx=Math.min(Math.max(px,bx+22),bx+w-22),ty=Math.max(py-6,by+h+8);
  return '<g class="bubl"><path d="M'+(tx-11)+','+(by+h-3)+' L'+tx+','+ty+' L'+(tx+11)+','+(by+h-3)+'Z" fill="'+fill+'" stroke="'+stc+'" stroke-width="2.5" stroke-linejoin="round"/><rect x="'+bx+'" y="'+by+'" width="'+w+'" height="'+h+'" rx="18" fill="'+fill+'" stroke="'+stc+'" stroke-width="2.5"/><rect x="'+(tx-10)+'" y="'+(by+h-5)+'" width="20" height="6" fill="'+fill+'"/>'+
    L.map(function(l,i){return '<text x="'+(bx+w/2)+'" y="'+(by+31+i*lh)+'" text-anchor="middle" font-family="'+HF+'" font-weight="700" font-size="'+fs+'" fill="'+tc+'">'+escX(l)+'</text>';}).join('')+'</g>';}

  if(p.ch){body=charSVG(a,talking);R=86*p.cs/0.6;cy=-175*p.cs;}else{body='<g transform="scale('+(a.s||1)*PS+')">'+(PROP[a.t]||'')+'</g>';R=60*(a.s||1)*PS;cy=0;}

  if(a.st==='ok'){halo='<circle class="halo" cx="0" cy="'+cy+'" r="'+R+'" fill="'+GO+'" opacity=".2"/>';mark='<g transform="translate('+(R*0.72)+','+(cy-R*0.72)+')"><circle r="15" fill="'+GO+'" stroke="'+P.cream+'" stroke-width="3"/><path d="M-7,0 l5,5 9,-10" stroke="'+P.cream+'" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>';}
  if(a.st==='x')mark='<g stroke="'+STOP+'" stroke-width="9" stroke-linecap="round" opacity=".9"><path d="M'+(-R*0.62)+','+(cy-R*0.62)+' L'+(R*0.62)+','+(cy+R*0.62)+' M'+(R*0.62)+','+(cy-R*0.62)+' L'+(-R*0.62)+','+(cy+R*0.62)+'"/></g>';

function zoneSVG(z){var x=z.x*8,y=z.y*5.2,w=z.w*8,h=z.h*5.2;
  if(z.k==='wall')return '<rect x="'+x+'" y="'+y+'" width="'+Math.max(w,10)+'" height="'+(FEET-y)+'" rx="4" fill="'+P.navy+'"/><rect x="'+x+'" y="'+y+'" width="'+Math.max(w,10)/2+'" height="'+(FEET-y)+'" fill="'+P.cream+'" opacity=".15"/>';
