function stateAt(steps,i){var st={};for(var j=0;j<=i;j++){var A2=steps[j].a||{};for(var id in A2){var v=A2[id];if(v===null){delete st[id];continue;}var b={};var old=st[id]||{};for(var k in old)if(k!=='say'&&k!=='fx'&&k!=='from')b[k]=old[k];for(var k2 in v)b[k2]=v[k2];st[id]=b;}}
  for(var id2 in st){if(!(steps[i].a||{})[id2]||steps[i].a[id2]===null){delete st[id2].say;delete st[id2].fx;delete st[id2].from;}}return st;}
function sceneSVG(mode,st){var g='<rect width="'+VW+'" height="'+VH+'" fill="'+P.sand+'"/>';
  g+='<path d="M0,0 H'+VW+' V'+FEET+' H0Z" fill="#F7E6C3" opacity=".6"/>';
  (mode.zones||[]).forEach(function(z){g+=zoneSVG(z);});
  g+='<rect x="0" y="'+FEET+'" width="'+VW+'" height="'+(VH-FEET)+'" fill="'+P.sand3+'"/><path d="M0,'+(FEET+2)+' H'+VW+'" stroke="'+P.cream+'" stroke-width="3" opacity=".5"/>';
  var ids=Object.keys(st).sort(function(a,b){return (CHAR[st[a].t]?1:0)-(CHAR[st[b].t]?1:0);});
  ids.forEach(function(id){g+=actorSVG(id,st[id]);});
  BUBS=[];ids.forEach(function(id){var a=st[id];if(!a.say)return;var p=pos(a);var top=p.ch?FEET-380*p.cs:p.y-50*(a.s||1)*PS;g+=bubbleSVG(p.x+(p.ch?6:0),top,a.say,a.t==='crook'?'bad':a.t==='ai'?'ai':'');});
  return g;}
function animScene(svg,st,prev,first){if(RM||!svg.animate)return;
  svg.querySelectorAll('.act').forEach(function(el){var id=el.dataset.id,a=st[id],mv=el.querySelector('.mv'),fx=el.querySelector('.fx');var p=pos(a);
    mv.style.transformBox='fill-box';mv.style.transformOrigin='50% 100%';
    var old=prev&&prev[id];
    if(a.from){var fp=pos({t:a.t,x:a.from[0],y:a.from[1],s:a.s});mv.animate([{transform:'translate('+(fp.x-p.x)+'px,'+(fp.y-p.y)+'px)',opacity:.2},{transform:'none',opacity:1}],{duration:1000,easing:'cubic-bezier(.45,0,.2,1)',fill:'backwards',delay:120});}
    else if(!old&&!first){mv.animate([{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'none'}],{duration:480,easing:'cubic-bezier(.3,1.6,.5,1)',fill:'backwards',delay:120});}
    else if(old){var op=pos(old);if(op.x!==p.x||op.y!==p.y||(old.s||1)!==(a.s||1))mv.animate([{transform:'translate('+(op.x-p.x)+'px,'+(op.y-p.y)+'px)'},{transform:'none'}],{duration:1000,easing:'cubic-bezier(.45,0,.2,1)'});}
    if(a.fx&&fx){fx.style.transformBox='fill-box';fx.style.transformOrigin='50% 100%';
      if(a.fx==='shake')fx.animate([{transform:'none'},{transform:'rotate(-5deg)'},{transform:'rotate(5deg)'},{transform:'rotate(-4deg)'},{transform:'none'}],{duration:620,delay:700,iterations:2});
      else fx.animate([{transform:'none'},{transform:'scale(1.12)'},{transform:'none'}],{duration:560,delay:600,iterations:3});}
    if(old&&old.st!==a.st&&a.st){var hm=el.querySelectorAll('.halo,.mv>g:not(.fx)');hm.forEach(function(h){h.style.transformBox='fill-box';h.style.transformOrigin='center';h.animate([{opacity:0,transform:'scale(.3)'},{opacity:1,transform:'none'}],{duration:450,delay:760,easing:'cubic-bezier(.3,1.6,.5,1)',fill:'backwards'});});}
  });
  svg.querySelectorAll('.bubl').forEach(function(b,k){b.style.transformBox='fill-box';b.style.transformOrigin='50% 100%';b.animate([{opacity:0,transform:'scale(.6) translateY(10px)'},{opacity:1,transform:'none'}],{duration:420,delay:(first?500:850)+k*260,easing:'cubic-bezier(.3,1.5,.5,1)',fill:'backwards'});});}

/* A scene widget: story (tap through) or rule (without / with tabs) */
var SCN=[];
function Scene(host){var self=this;this.host=host;this.key=host.dataset.scene;this.def=SCENES[this.key];this.modes=Object.keys(this.def);this.mode=this.modes[0];this.i=0;this.prev=null;this.t=null;this.rule=this.modes.length>1;
  var ctl=this.rule?
    '<div class="tabs mtabs" role="tablist" style="--n:2"><button type="button" role="tab" aria-selected="true" data-mode="without">✕ Without it</button><button type="button" role="tab" aria-selected="false" data-mode="with" data-g="with">✓ With it</button></div>':'';
  host.innerHTML=ctl+'<div class="scv"><svg class="art on" viewBox="0 0 '+VW+' '+VH+'" role="img" aria-label="Animated story"></svg></div>'+
    '<div class="box scap" aria-live="polite"><div class="pager"><span class="sstep"></span><span class="dots"></span></div><p class="stxt"></p></div>'+
    '<div class="sctl">'+(this.rule?'<button type="button" class="btnA ghost replay">↻ Replay</button>':'<button type="button" class="sq sprev" aria-label="Previous step"><svg viewBox="0 0 20 20"><path d="M12 4 6 10l6 6" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button type="button" class="btnA snext" data-manual data-g="story">Next step ▸</button>')+'</div>';
  this.svg=host.querySelector('svg');this.txt=host.querySelector('.stxt');this.sstep=host.querySelector('.sstep');this.dots=host.querySelector('.dots');
  if(this.rule){host.querySelectorAll('[data-mode]').forEach(function(b){b.addEventListener('click',function(){self.setMode(b.dataset.mode);self.autoplay();});});
    host.querySelector('.replay').addEventListener('click',function(){self.autoplay();});}
  else{host.querySelector('.snext').addEventListener('click',function(){var n=self.steps().length;if(self.i>=n-1){self.go(0,true);return;}self.go(self.i+1);hit(this,'s'+self.i);});
    host.querySelector('.sprev').addEventListener('click',function(){if(self.i>0)self.go(self.i-1);});}
  this.go(0,true);SCN.push(this);}
Scene.prototype.steps=function(){return this.def[this.mode].steps;};
Scene.prototype.setMode=function(m){this.stop();this.mode=m;this.prev=null;this.host.querySelectorAll('[data-mode]').forEach(function(b){b.setAttribute('aria-selected',String(b.dataset.mode===m));});this.go(0,true);};
Scene.prototype.go=function(i,first){var steps=this.steps(),st=stateAt(steps,i);this.i=i;
  this.svg.innerHTML=sceneSVG(this.def[this.mode],st);animScene(this.svg,st,first?null:this.prev,first);this.prev=st;
  this.txt.textContent=steps[i].c;this.sstep.textContent=(this.rule?(this.mode==='with'?'With it · ':'Without it · '):'')+'Step '+(i+1)+' of '+steps.length;
  this.dots.innerHTML=steps.map(function(_,k){return '<i class="'+(k<=i?'on':'')+'"></i>';}).join('');
  var nb=this.host.querySelector('.snext');if(nb)nb.textContent=i>=steps.length-1?'↻ Watch again':'Next step ▸';
  if(!first&&this.txt.animate&&!RM)this.txt.animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:350});};
Scene.prototype.stop=function(){clearTimeout(this.t);this.t=null;};
Scene.prototype.autoplay=function(){var self=this;this.stop();var n=this.steps().length;
  if(RM){this.go(n-1,true);return;}this.go(0,true);
  var tick=function(){if(self.i>=n-1)return;self.go(self.i+1);if(self.i<n-1)self.t=setTimeout(tick,2300+self.steps()[self.i].c.length*20);};
  this.t=setTimeout(tick,2000+this.steps()[0].c.length*20);};
Scene.prototype.reset=function(){this.stop();if(this.rule){this.setMode('without');this.autoplay();}else{this.prev=null;this.go(0,true);}};

  var locked=(id==='hello'&&!NAME)||!isOpen(c);nextBtn.classList.toggle('locked',locked);nextBtn.setAttribute('aria-disabled',String(locked));
  if(id==='hello'&&!NAME){nextLabel.textContent='Pick your name';return;}
  nextBtn.style.setProperty('--pg',locked&&need(c)?(got(c)/need(c)*100)+'%':'0%');
  if(locked){nextLabel.textContent=c.dataset.glabel+(need(c)>1?'  '+got(c)+'/'+need(c):'');return;}
  if(id==='hello')nextLabel.textContent='Continue as '+NAME;
  else if(!nx)nextLabel.textContent='Back to the start';
  else if(id==='start')nextLabel.textContent='Let\'s go, '+NAME;
  else if(stopOf(i+1)!==id)nextLabel.textContent='Next: '+stopInfo(stopOf(i+1)).name;
  else nextLabel.textContent='Next';}
function show(i,dir){if(i<0||i>=cards.length)return;if(!NAME&&i>0)i=0;var prev=cards[cur];if(prev)prev.hidden=true;
  cur=i;var c=cards[i];c.hidden=false;c.scrollTop=0;if(dir&&c.animate&&!RM)c.animate([{transform:'translateX('+(dir>0?36:-36)+'px)',opacity:0},{transform:'none',opacity:1}],{duration:300,easing:'cubic-bezier(.2,.7,.2,1)'});
  var id=stopOf(i),info=stopInfo(id),p=idxInStop(i);seen[id]=true;
  document.getElementById('whereName').textContent=(info.n&&info.n!=='★'?info.n+' · ':'')+info.name;document.getElementById('whereSub').textContent=info.sub;
  count.textContent=(id==='hello'||id==='start')?'':(p.pos+1)+'/'+p.list.length;
  segs.innerHTML=(id==='hello'||id==='start')?STOPS.slice(2).map(function(){return '<i></i>';}).join(''):p.list.map(function(_,k){return '<i class="'+(k<p.pos?'done':k===p.pos?'now':'')+'"></i>';}).join('');
  prevBtn.disabled=i===0;nextBtn.classList.remove('unlock');updateNav();
  try{history.replaceState(null,'','#'+id);}catch(e){}
  if(NAME&&i>0)store('aisg-card-'+NAME,String(i));
  ghostStop();howtoSync(c);if(NAME&&i>0)trVisit(c,i);animateCard(c);armIdle();setTimeout(function(){if(cards[cur]===c)ghostDemo(c);},RM?0:1600);requestAnimationFrame(checkOverflow);}
function step(d){if(d>0&&cur>=0){var c=cards[cur];if((stopOf(cur)==='hello'&&!NAME)||!isOpen(c)){nextBtn.classList.remove('shake');void nextBtn.offsetWidth;nextBtn.classList.add('shake');pointOut(c);return;}}
  var n=cur+d;if(n>=cards.length)n=1;if(n<0)return;show(n,d);}
nextBtn.addEventListener('click',function(){step(1);});prevBtn.addEventListener('click',function(){step(-1);});
cards.forEach(function(c){c.addEventListener('scroll',checkOverflow,{passive:true});});
window.addEventListener('resize',checkOverflow);
function firstOf(id){for(var k=0;k<cards.length;k++)if(cards[k].dataset.stop===id)return k;return 0;}
document.addEventListener('click',function(e){var b=e.target.closest('[data-jump]');if(b)show(firstOf(b.dataset.jump),-1);});
document.addEventListener('keydown',function(e){if(!sheet.hidden){if(e.key==='Escape')closeSheet();return;}var t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'))return;if(e.key==='ArrowRight'){step(1);e.preventDefault();}if(e.key==='ArrowLeft'){step(-1);e.preventDefault();}});
var sx=null,sy=0,st=0;
stage.addEventListener('touchstart',function(e){if(e.touches.length!==1)return;if(e.target.closest('input,.tlBtns,.moves,.segBtns'))return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now();},{passive:true});
stage.addEventListener('touchend',function(e){if(sx==null)return;var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;sx=null;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.6&&Date.now()-st<700)step(dx<0?1:-1);},{passive:true});
var sheet=document.getElementById('sheet'),stopList=document.getElementById('stopList');
function openSheet(){var curStop=stopOf(cur);document.getElementById('sheetTitle').textContent=NAME?NAME+'\'s route':'The route';
  stopList.innerHTML=STOPS.slice(1).map(function(s){var n=cards.filter(function(c){return c.dataset.stop===s.id;}).length;return '<button class="stopBtn'+(s.id===curStop?' cur':seen[s.id]?' seen':'')+'" type="button" data-stop-go="'+s.id+'"><span class="n">'+(s.n===''?'▶':s.n)+'</span><span><b>'+s.name+'</b><small>'+s.sub+'</small></span><span class="st">'+n+'</span></button>';}).join('');
  sheet.hidden=false;var c=stopList.querySelector('.cur');(c||document.getElementById('sheetClose')).focus();}
function closeSheet(){sheet.hidden=true;document.getElementById('menuBtn').focus();}
document.getElementById('menuBtn').addEventListener('click',openSheet);
document.getElementById('sheetClose').addEventListener('click',closeSheet);
document.getElementById('switchUser').addEventListener('click',function(){sheet.hidden=true;show(0,-1);});
sheet.addEventListener('click',function(e){if(e.target===sheet)closeSheet();var b=e.target.closest('[data-stop-go]');if(b){sheet.hidden=true;show(firstOf(b.dataset.stopGo),1);}});
window.addEventListener('hashchange',function(){var id=(location.hash||'').slice(1);if(id&&stopInfo(id)&&stopOf(cur)!==id)show(firstOf(id),1);});
window.__show=function(i){show(i,0);};

/* ---------- team tracking (works only inside the claude.ai artifact) ---------- */
var TR={db:null,user:null,ref:null,doc:null,dirty:false,writing:false,owner:false,lastAct:Date.now(),lastFlush:0,sessName:null};
function nowISO(){return new Date().toISOString();}
function trTitle(c){var h=c.querySelector('.t1,.t2,.raQ')||c.querySelector('.eyebrow');var t=h?h.textContent.replace(/\s+/g,' ').trim():'';if(c.dataset.case!=null)t='Practice '+(+c.dataset.case+1)+': '+t;return t.slice(0,70)||c.dataset.key;}
function trRec(){if(!TR.doc||!NAME)return null;var n=TR.doc.names=TR.doc.names||{};var r=n[NAME];if(!r)r=n[NAME]={firstSeen:nowISO(),lastSeen:nowISO(),sessions:0,secs:0,cards:{},furthest:0};return r;}
function trSession(){var r=trRec();if(!r||TR.sessName===NAME)return;TR.sessName=NAME;r.sessions=(r.sessions||0)+1;r.lastSeen=nowISO();
  var log=TR.doc.log=TR.doc.log||[];log.push({name:NAME,start:nowISO(),secs:0});if(log.length>60)log.splice(0,log.length-60);TR.dirty=true;trFlush(true);}
function trVisit(c,i){var r=trRec();if(!r)return;trSession();var k=c.dataset.key,e=r.cards[k]=r.cards[k]||{t:trTitle(c),s:0,v:0,i:i,stop:c.dataset.stop};e.v++;e.i=i;e.t=trTitle(c);
  r.furthest=Math.max(r.furthest||0,i);r.current=i;r.lastSeen=nowISO();r.slidesSeen=Object.keys(r.cards).length;r.slidesTotal=cards.length;
  if(c.dataset.stop==='card'&&!r.reachedEndAt)r.reachedEndAt=nowISO();if(!r.completedAt&&r.reachedEndAt&&r.slidesSeen>=cards.length-2)r.completedAt=nowISO();TR.dirty=true;trFlush(false);}
function trUnlock(c){var r=trRec();if(!r)return;var e=r.cards[c.dataset.key];if(e&&!e.u){e.u=nowISO();TR.dirty=true;}}
function trPractice(n,done){var r=trRec();if(!r)return;r.practice={score:n,answered:done,of:GAME.length};TR.dirty=true;}
['pointerdown','keydown','touchstart','wheel'].forEach(function(ev){document.addEventListener(ev,function(){TR.lastAct=Date.now();},{capture:true,passive:true});});
document.addEventListener('scroll',function(){TR.lastAct=Date.now();},{capture:true,passive:true});
setInterval(function(){if(!TR.doc||!NAME||cur<0||document.visibilityState!=='visible')return;if(Date.now()-TR.lastAct>120000)return;
  var r=trRec(),c=cards[cur],e=r&&r.cards[c.dataset.key];if(!e)return;e.s++;r.secs=(r.secs||0)+1;TR.doc.totalSecs=(TR.doc.totalSecs||0)+1;
  var log=TR.doc.log||[];var L=log[log.length-1];if(L&&L.name===NAME){L.secs=(L.secs||0)+1;L.end=nowISO();}TR.dirty=true;},1000);
setInterval(function(){trFlush(false);},20000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')trFlush(true);});
function trFlush(force){if(!TR.ref||!TR.doc||!TR.dirty||TR.writing)return;if(!force&&Date.now()-TR.lastFlush<8000)return;
  TR.writing=true;TR.dirty=false;TR.lastFlush=Date.now();TR.doc.lastSeen=nowISO();var body=JSON.parse(JSON.stringify(TR.doc));
  TR.ref.set(body).then(function(){TR.writing=false;},function(e){TR.writing=false;if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted'||e.code==='quota_exceeded')){TR.ref=null;}else TR.dirty=true;});}
(async function(){try{if(!window.claude||!window.claude.use)return;var db=await window.claude.use('db');if(!db)return;var user=await window.claude.use('user');if(!user)return;
  var uid=await user.id();TR.owner=!!(await user.isOwner());if(TR.owner)document.getElementById('statsBtn').hidden=false;if(!uid)return;
  TR.db=db;TR.user=user;TR.ref=db.doc('track/'+uid);var snap=await TR.ref.get();
  TR.doc=snap.exists?JSON.parse(JSON.stringify(snap.data())):{v:1,firstSeen:nowISO(),names:{},log:[],totalSecs:0};
  if(NAME&&cur>0)trVisit(cards[cur],cur);}catch(e){}})();

/* ---------- owner-only stats panel ---------- */
var statsEl=document.getElementById('stats');
function fmtT(s){s=Math.round(s||0);if(s<60)return s+'s';var m=Math.floor(s/60),r=s%60;return m<60?m+'m '+(r<10?'0':'')+r+'s':Math.floor(m/60)+'h '+(m%60)+'m';}
function fmtD(iso){if(!iso)return '–';var d=new Date(iso);return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+', '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});}
async function openStats(){statsEl.hidden=false;sheet.hidden=true;var body=document.getElementById('statsBody');body.innerHTML='<p class="mute">Loading…</p>';
  if(!TR.db){body.innerHTML='<p class="mute">Stats are only available in the claude.ai version of this guide.</p>';return;}
  try{trFlush(true);var qs=await TR.db.collection('track').get();var people={},ids=[];
    qs.docs.forEach(function(sn){var d=sn.data()||{};ids.push(sn.id);Object.keys(d.names||{}).forEach(function(n){var r=d.names[n];var P=people[n]=people[n]||{name:n,sessions:0,secs:0,cards:{},firstSeen:null,lastSeen:null,completedAt:null,practice:null,accounts:[],slidesTotal:r.slidesTotal||cards.length,log:[]};
      P.sessions+=r.sessions||0;P.secs+=r.secs||0;P.accounts.push(sn.id);if(!P.firstSeen||r.firstSeen<P.firstSeen)P.firstSeen=r.firstSeen;if(!P.lastSeen||r.lastSeen>P.lastSeen)P.lastSeen=r.lastSeen;
      if(r.completedAt&&(!P.completedAt||r.completedAt<P.completedAt))P.completedAt=r.completedAt;if(r.practice&&(!P.practice||r.practice.answered>=P.practice.answered))P.practice=r.practice;
      Object.keys(r.cards||{}).forEach(function(k){var e=r.cards[k],Q=P.cards[k]=P.cards[k]||{t:e.t,s:0,v:0,i:e.i,stop:e.stop,u:null};Q.s+=e.s||0;Q.v+=e.v||0;if(e.u)Q.u=e.u;});
      (d.log||[]).forEach(function(L){if(L.name===n)P.log.push(L);});});});
    var prof={};try{prof=await TR.user.profiles(ids);}catch(e){}
    var list=Object.keys(people).map(function(k){return people[k];}).sort(function(a,b){return (b.lastSeen||'').localeCompare(a.lastSeen||'');});
    var done=list.filter(function(p){return p.completedAt;}).length;
    document.getElementById('statsSub').textContent='Only you can see this. Time counts only while the guide is open and in use (pauses after 2 idle minutes).';
    if(!list.length){body.innerHTML='<p class="mute">No one has signed in yet. Once your team opens this link and picks their name, they will show up here.</p>';return;}
    var h='<div class="stTop"><div><b>'+list.length+'</b><span>signed in</span></div><div><b>'+done+'</b><span>completed</span></div><div><b>'+fmtT(list.reduce(function(a,p){return a+p.secs;},0))+'</b><span>total time</span></div></div>';
    h+=list.map(function(p){var seen=Object.keys(p.cards).length,tot=p.slidesTotal||cards.length,pct=Math.min(100,Math.round(seen/tot*100));
      var acct=p.accounts.map(function(id){var pr=prof[id];return (pr&&pr.name)||'Unnamed account';}).join(', ');
      var rows=Object.keys(p.cards).map(function(k){return p.cards[k];}).sort(function(a,b){return (a.i||0)-(b.i||0);});
      var max=rows.reduce(function(a,r){return Math.max(a,r.s);},1);
      var top=rows.slice().sort(function(a,b){return b.s-a.s;}).slice(0,3);
      return '<details class="stP"><summary><span class="av" style="background:'+((PEOPLE[p.name]||{}).c||'#566078')+'">'+esc(p.name.charAt(0))+'</span><span class="stN"><b>'+esc(p.name)+'</b><small>'+(p.completedAt?'<em class="ok">✓ Completed '+fmtD(p.completedAt)+'</em>':'<em>'+pct+'% of slides seen</em>')+'</small></span><span class="stM">'+fmtT(p.secs)+'</span></summary>'+
        '<div class="stG"><div><span>Sessions</span><b>'+p.sessions+'</b></div><div><span>Slides seen</span><b>'+seen+'/'+tot+'</b></div><div><span>Practice</span><b>'+(p.practice?p.practice.score+'/'+p.practice.of+(p.practice.answered<p.practice.of?' ('+p.practice.answered+' done)':''):'–')+'</b></div><div><span>First seen</span><b>'+fmtD(p.firstSeen)+'</b></div><div><span>Last active</span><b>'+fmtD(p.lastSeen)+'</b></div><div><span>Account</span><b>'+esc(acct)+'</b></div></div>'+
        '<p class="stH">Most time spent</p><p class="mute" style="font-size:13px">'+top.map(function(r){return esc(r.t)+' ('+fmtT(r.s)+')';}).join(' · ')+'</p>'+
        '<p class="stH">Time per slide</p><div class="stRows">'+rows.map(function(r){return '<div class="stR"><span class="t">'+esc(r.t)+'</span><span class="bar"><i style="width:'+Math.max(3,r.s/max*100)+'%"></i></span><span class="s">'+fmtT(r.s)+(r.v>1?' · '+r.v+'×':'')+'</span></div>';}).join('')+'</div>'+
        '<p class="stH">Recent sessions</p><div class="stRows">'+p.log.slice(-8).reverse().map(function(L){return '<div class="stR"><span class="t">'+fmtD(L.start)+'</span><span class="s">'+fmtT(L.secs)+'</span></div>';}).join('')+'</div></details>';}).join('');
    body.innerHTML=h;}catch(e){body.innerHTML='<p class="mute">Couldn\'t load stats right now. Try again in a moment.</p>';}}
document.getElementById('statsBtn').addEventListener('click',openStats);
document.getElementById('statsClose').addEventListener('click',function(){statsEl.hidden=true;});
statsEl.addEventListener('click',function(e){if(e.target===statsEl)statsEl.hidden=true;});

var _ac=animateCard;animateCard=function(c){_ac(c);SCN.forEach(function(s){if(c.contains(s.host))s.reset();else s.stop();});};
/* ---------- texture + start ---------- */
(function(){var c=document.createElement('canvas');c.width=c.height=340;var x=c.getContext&&c.getContext('2d');if(!x)return;var dd=x.createImageData(340,340);
  for(var i=0;i<dd.data.length;i+=4){var a=Math.random()<.3?Math.random()*70:0;dd.data[i]=46;dd.data[i+1]=30;dd.data[i+2]=22;dd.data[i+3]=a;}
  x.putImageData(dd,0,0);for(var k=0;k<150;k++){x.strokeStyle='rgba(40,28,20,'+(Math.random()*.09+.03)+')';x.lineWidth=Math.random()*2+.5;var yy=Math.random()*340,xx=Math.random()*340,l=Math.random()*120+30;x.beginPath();x.moveTo(xx,yy);x.bezierCurveTo(xx+l*.3,yy+Math.random()*3-1.5,xx+l*.7,yy+Math.random()*3-1.5,xx+l,yy+Math.random()*4-2);x.stroke();}
  try{var u='url('+c.toDataURL()+')';document.querySelectorAll('.tex').forEach(function(e){e.style.backgroundImage=u;});}catch(e){}})();
personalize();
var h=(location.hash||'').slice(1),startAt=0;
if(NAME){if(h&&stopInfo(h)&&h!=='hello')startAt=firstOf(h);else{var saved=parseInt(store('aisg-card-'+NAME),10);startAt=saved>0&&saved<cards.length?saved:1;}}
show(startAt,0);
try{document.fonts.ready.then(checkOverflow);}catch(e){}setTimeout(checkOverflow,800);

})();
</script>
