<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>StarWell Call Decks</title>
<link rel="icon" href="../starwell-practice/assets/favicon-64.png">
<style>
:root{
  --bg:#f4f5f7; --surface:#fff; --soft:#f7f8fa; --ink:#171a21; --ink2:#3b4250; --muted:#667085; --faint:#98a1b0;
  --line:#e4e7ec; --line2:#d0d5dd; --accent:#2f5bd3; --accent-soft:#edf2fe;
  --ok:#1f7a4d; --ok-soft:#e7f5ed; --warn:#8a5a00; --warn-soft:#fdf3e1; --bad:#b42318; --bad-soft:#fdecea;
  --font:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(16,24,40,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent)} button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h1,h2,h3,p{margin:0}
.bar{position:sticky;top:0;z-index:20;height:52px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 14px}
.bar img{height:24px;margin-right:8px}
.nav{padding:8px 12px;border-radius:8px;font-weight:600;color:var(--muted);font-size:14px;text-decoration:none;min-height:36px;display:inline-flex;align-items:center}
.nav.on{background:var(--accent-soft);color:var(--accent)}
.sp{flex:1}
.me{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.me select{font:inherit;padding:6px 8px;border:1px solid var(--line2);border-radius:8px;background:#fff;min-height:36px}
.shell{display:grid;grid-template-columns:310px 1fr;height:calc(100vh - 52px)}
.side{border-right:1px solid var(--line);background:var(--surface);overflow:auto;padding:12px}
.main{overflow:auto;padding:20px 24px 60px}
.wrap{max-width:1060px;margin:0 auto}
.search{width:100%;padding:9px 12px;border:1px solid var(--line2);border-radius:8px;font:inherit;background:#fff;min-height:40px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.chip{padding:6px 11px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-size:13px;min-height:32px;color:var(--ink2)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grp{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:16px 4px 6px;display:flex;justify-content:space-between}
.grpwhy{font-size:12.5px;color:var(--muted);margin:0 4px 8px}
.row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;text-decoration:none;color:inherit;border:1px solid transparent}
.row:hover{background:var(--soft)} .row.on{background:var(--accent-soft);border-color:#cfdcfb}
.row .b{flex:1;min-width:0} .row strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row span.s{font-size:12.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ok)} .dot.check{background:#e0a100} .dot.hold{background:var(--bad)}
.tag{font-size:11.5px;padding:3px 8px;border-radius:999px;font-weight:600;white-space:nowrap;flex:none}
.tag.phone{background:#eaf0fd;color:#2f5bd3}.tag.site{background:#f1ecfb;color:#6b3fc0}.tag.found{background:var(--ok-soft);color:var(--ok)}.tag.social{background:var(--warn-soft);color:var(--warn)}.tag.custom{background:#eef0f3;color:var(--ink2)}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.pill.ready{background:var(--ok-soft);color:var(--ok)}.pill.check{background:var(--warn-soft);color:var(--warn)}.pill.hold{background:var(--bad-soft);color:var(--bad)}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:14px}
.head h1{font-size:24px;line-height:1.2;font-weight:700}
.head .meta{color:var(--muted);font-size:14px;width:100%}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;text-decoration:none;padding:9px 14px;border-radius:8px;font-weight:600;min-height:40px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:10px}
.top{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.brief{display:grid;grid-template-columns:86px 1fr;gap:9px 14px}
.brief dt{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-top:3px}
.brief dd{margin:0}
.brief dd small{display:block;color:var(--muted);font-size:13px}
.q{font-weight:600}
.scan{display:grid;gap:8px}
.scanrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:8px 10px;border-radius:8px;border:1px solid var(--line);text-align:left;width:100%}
.scanrow.lead{border-color:var(--accent);background:var(--accent-soft)}
.scanrow b{font-size:14px} .scanrow small{grid-column:1/-1;color:var(--muted);font-size:12.5px}
.pips{display:flex;gap:3px} .pips i{width:14px;height:6px;border-radius:3px;background:var(--line)} .pips i.f{background:var(--ink)} .pips.s3 i.f{background:var(--bad)} .pips.s2 i.f{background:#d98300} .pips.s1 i.f{background:var(--faint)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;min-height:42px}
.tab.on{color:var(--accent);border-color:var(--accent)}
.call{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
.steps{display:flex;gap:6px;margin-bottom:12px}
.stepb{flex:1;padding:8px 6px;border-radius:8px;border:1px solid var(--line2);background:#fff;font-size:13px;font-weight:600;color:var(--muted);min-height:44px;line-height:1.2}
.stepb b{display:block;font-size:11px;color:var(--faint)} .stepb.on{background:var(--ink);color:#fff;border-color:var(--ink)} .stepb.on b{color:#c6cbd6}
.say{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:8px;padding:11px 13px;font-size:17px;line-height:1.45;margin:8px 0}
.say small,.him small{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:2px}
.him{background:var(--soft);border-left:3px solid var(--line2);border-radius:8px;padding:9px 13px;color:var(--ink2);margin:8px 0}
.hint{font-size:13.5px;color:var(--muted);margin-top:8px}
.lift{background:var(--ok-soft);color:#14532d;border-radius:8px;padding:10px 12px;font-size:14px;margin-top:10px}
.note{background:var(--warn-soft);color:#5c3d00;border-radius:8px;padding:10px 12px;font-size:14px;margin:0 0 12px}
.stop{background:var(--bad-soft);color:#7a1a12;border-radius:8px;padding:10px 12px;font-size:14px;margin:0 0 12px}
.nextrow{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
details{border-top:1px solid var(--line);padding:10px 0} details:first-of-type{border-top:0}
summary{font-weight:600;cursor:pointer;min-height:26px;list-style-position:outside}
details p,details li{color:var(--ink2)} details .say{font-size:15.5px}
ul,ol{margin:6px 0 0;padding-left:20px} li{margin-bottom:5px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:7px 14px;font-size:14.5px} .kv dt{color:var(--muted)} .kv dd{margin:0}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0}
.box{background:var(--soft);border-radius:8px;padding:11px 12px;font-size:14px}
.box small{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:3px}
.proof li{margin-bottom:8px} .proof a,.src{font-size:12.5px;color:var(--muted);white-space:nowrap}
.syshead{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.sysb{color:var(--ink);padding:9px 14px;border-radius:8px;border:1px solid var(--line2);background:#fff;font-weight:600;min-height:42px}
.sysb.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg{display:inline-flex;background:#eceef2;border-radius:8px;padding:3px;margin-bottom:6px} .seg button{padding:5px 12px;border-radius:6px;font-size:13px;font-weight:600;color:var(--muted)} .seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.check{font-size:13px;color:var(--warn);margin-top:4px}
.tick{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 14px;font-size:14px} .tick span.y{color:var(--ok)} .tick span.n{color:var(--bad)}
.foot{font-size:12.5px;color:var(--faint);margin-top:24px}
.backm{display:none}
.hidden{display:none!important}
@media (max-width:980px){
  .shell{display:block;height:auto} .side{border:0;padding:12px 14px 40px} .main{padding:14px 14px 60px}
  body.detail .side{display:none} body:not(.detail) .main{display:none}
  .top,.call,.two{grid-template-columns:1fr} .three{grid-template-columns:1fr}
  .backm{display:inline-block;margin-bottom:8px;font-size:14px;text-decoration:none}
  .brief{grid-template-columns:1fr;gap:2px} .brief dt{margin-top:8px}
  .kv{grid-template-columns:1fr;gap:1px} .kv dt{margin-top:8px}
  .bar{overflow-x:auto} .me span{display:none}
  .stepb .nm{display:none} .stepb b{font-size:12px} .nav{white-space:nowrap}
}
@media print{.bar,.side,.tabs,.steps,.nextrow,.btn,.backm{display:none!important}.shell{display:block;height:auto}.main{overflow:visible}.pane,.stepp{display:block!important}.card{box-shadow:none;break-inside:avoid;margin-bottom:10px}}

/* ---- My calls dashboard ---- */
.linkb{color:var(--accent);font-size:13px;text-decoration:underline;padding:4px}
.signin{max-width:380px;margin:40px auto}
.err{color:var(--bad);font-size:13.5px;min-height:20px;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px} .tiles.t2{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.tile b{display:block;font-size:26px;line-height:1.1} .tile span{font-size:13px;color:var(--ink2)} .tile small{display:block;font-size:12px;color:var(--ok);margin-top:2px}
.read{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)} .read:first-of-type{border-top:0;padding-top:0}
.read>span{font-size:22px} .read small{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700} .read p{color:var(--ink2);font-size:14px;margin-top:2px}
.badge{background:var(--ok-soft);color:#14532d;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.crow{display:flex;gap:10px;padding:9px 6px;border-top:1px solid var(--line);text-decoration:none;color:inherit;border-radius:6px} .crow:first-of-type{border-top:0} .crow:hover{background:var(--soft)}
.crow .ci{font-size:20px;width:26px;text-align:center} .crow .b{flex:1;min-width:0} .crow strong{display:block;font-size:14.5px} .crow .s{display:block;font-size:12.5px;color:var(--muted)} .crow .w{color:var(--ok)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:7px 0;cursor:pointer;font-size:15px} .chk input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--accent)} .chk .s{color:var(--muted);font-size:13px}
.call2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start;padding-bottom:70px}
.outs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.out{border:1px solid var(--line2);border-radius:10px;padding:10px 6px;font-size:13.5px;font-weight:600;line-height:1.25;min-height:74px;background:#fff} .out span{display:block;font-size:22px;margin-bottom:2px} .out.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.ql{font-weight:600;margin:14px 0 6px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px} .scale button{border:1px solid var(--line2);border-radius:8px;min-height:42px;font-weight:700;background:#fff} .scale button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.scl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:3px}
.fq{display:block;font-weight:600;margin-top:12px} .fq textarea{display:block;width:100%;margin-top:6px;min-height:68px;padding:9px 11px;border:1px solid var(--line2);border-radius:8px;font:inherit;font-weight:400;resize:vertical}
.wfl{display:grid;gap:8px} .box.ok{background:var(--ok-soft);color:#14532d}
.talkbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden} .talkbar i{display:block;height:100%;background:var(--accent)}
.stp{display:grid;grid-template-columns:1fr;padding:6px 0;border-top:1px solid var(--line);font-size:14px;color:var(--muted)} .stp.y b{color:var(--ok)} .stp span{color:var(--ink2)}
.mom{border-left:3px solid var(--line2);padding:4px 0 4px 12px;margin:8px 0;font-size:14.5px} .mq{font-style:italic;color:var(--ink2)}
.trs{max-height:420px;overflow:auto;margin-top:8px} .trs p{margin:0 0 8px;padding:8px 10px;border-radius:8px;font-size:14px;background:var(--soft)} .trs p.me{background:var(--accent-soft)} .trs small{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.savebar{position:fixed;left:310px;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 24px;display:flex;gap:12px;align-items:center;z-index:15}
.back2{display:inline-block;margin-bottom:8px;font-size:14px;text-decoration:none}
@media (max-width:980px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.call2{grid-template-columns:1fr}.savebar{left:0;padding:10px 14px}.outs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media print{.savebar{display:none!important}}
</style>
</head>
<body>
<div class="bar">
  <img src="../starwell-practice/assets/starwell-logo.png" alt="StarWell">
  <a class="nav" data-n="q" href="#/">Call queue</a>
  <a class="nav" data-n="s" href="#/systems/phone">Systems</a>
  <a class="nav" data-n="p" href="#/playbook">Playbook</a>
  <a class="nav" data-n="m" href="#/calls">My calls</a>
  <span class="sp"></span>
  <span class="me" id="who"></span>
  <label class="me"><span>Signed in as</span><select id="me"><option>Dan</option><option>RJ</option><option value="Bobby">Bobby (view all)</option></select></label>
</div>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main class="main"><div class="wrap" id="app"></div></main>
</div>
<script src="../starwell-practice/config.js"></script>
<script src="../starwell-practice/offer.js"></script>
<script src="../starwell-practice/decks.js"></script>
<script src="../starwell-practice/needs.js"></script>
<script src="../starwell-practice/systems.js"></script>
<script>
'use strict';
const O = window.STARWELL_OFFER, D = window.STARWELL_DECKS, S = window.STARWELL_SYSTEMS;
const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SYS4 = ['phone','site','found','social'];
const TAG = {phone:'Answering line', site:'Website', found:'Getting found', social:'Social posts', custom:'Custom tools'};
const SCORE = ['Already strong','Small gaps','Clear gap','Urgent'];
const STATUS = {ready:'Ready to call', check:'Check first', hold:'On hold'};
let me = 'Dan', mine = true;
try{ const m = localStorage.getItem('sw_cc_me'); if(m && D.callers[m]) me = m; }catch(e){}
$('#me').value = me;
window.setMe = u => { if(D.callers[u]){ me = u; $('#me').value = u; } };
$('#me').onchange = e => { me = e.target.value; try{ localStorage.setItem('sw_cc_me', me); }catch(x){} route(); };

D.companies.forEach(c => { if(!c.status) c.status = c.flag ? 'check' : 'ready'; if(c.tier === 4) c.status = 'hold'; });
const order = D.companies.slice().sort((a,b) => a.tier - b.tier || (b.total || 0) - (a.total || 0));
order.forEach((c,i) => c.num = i + 1);
const byId = id => D.companies.find(c => c.id === id);
const first = c => c.first || ((c.ask === 'the owner' || / or /.test(c.ask)) ? '' : c.ask.split(' ')[0]);
const voice = c => c.caller || (me === 'Bobby' ? 'Dan' : me);
const isMine = c => me === 'Bobby' || !c.caller || c.caller === me;
const fill = (t, c) => O.fill(t, {me:voice(c), name:first(c) || 'there', shop:c.said, town:c.town.replace(' area',''), lead:c.lead});
const say = (t, lab) => `<div class="say"><small>${lab || 'You say'}</small>${esc(t)}</div>`;
const him = t => `<div class="him"><small>He might say</small>${esc(t)}</div>`;
const li = a => `<ul>${a.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
const tel = p => 'tel:' + String(p).replace(/[^\d]/g,'');
const src = u => u ? ` <a class="src" href="${esc(u)}" target="_blank" rel="noopener">source ↗</a>` : '';
const pips = n => `<span class="pips s${n}">${[1,2,3].map(i => `<i class="${i <= n ? 'f' : ''}"></i>`).join('')}</span>`;
const question = c => c.q || S[c.lead].ask;
const socialLine = n => n.social.filter(s => s.p).slice(0,2).map(s => `${s.p}: ${s.live === false ? 'link does not lead to a live page' : (s.last ? 'last post ' + s.last : 'no post date seen') + ', ' + (s.n90 == null ? '?' : s.n90) + ' posts in the last 90 days'}`).join('. ');
const whyLine = c => (c.lead === 'social' && c.n ? socialLine(c.n) + '.' : c.why) || '';
const topFinding = (c, k) => { if(!c.n) return ''; if(k === 'social') return socialLine(c.n); const p = c.n.proof.find(x => x.s === k && !x.note); return p ? p.t : ''; };
const lift = i => S.lifts[i % S.lifts.length];

/* ---------- queue (left rail) ---------- */
let filt = {q:'', lead:''};
function side(activeId){
  const scope = c => me === 'Bobby' || !mine || c.caller === me || c.tier === 4;
  const cnt = order.filter(c => c.caller === me).length;
  const rows = t => order.filter(c => scope(c) && c.tier === t && (!filt.lead || c.lead === filt.lead) && (!filt.q || (c.name + ' ' + c.town + ' ' + c.area + ' ' + c.ask).toLowerCase().includes(filt.q))).map(c =>
    `<a class="row ${c.id === activeId ? 'on' : ''}" href="#/c/${c.id}"><span class="dot ${c.status}" title="${STATUS[c.status]}"></span><span class="b"><strong>${esc(c.said)}</strong><span class="s">${esc(c.town)}${c.total != null ? ' · need ' + c.total + '/12' : ''}${typeof SWC !== 'undefined' && SWC.lastFor(c.id) ? ' · ' + SWC.lastFor(c.id).i + ' ' + SWC.lastFor(c.id).t : ''}</span></span>${c.caller && (me === 'Bobby' || !mine) ? `<span class="tag custom">${c.caller}</span>` : ''}${c.status === 'hold' ? '' : `<span class="tag ${c.lead}">${TAG[c.lead]}</span>`}</a>`).join('');
  $('#side').innerHTML = `
    ${me === 'Bobby' ? '' : `<div class="seg" style="display:flex;margin-bottom:8px"><button style="flex:1" class="${mine ? 'on' : ''}" data-mine="1">My shops (${cnt})</button><button style="flex:1" class="${mine ? '' : 'on'}" data-mine="">All shops</button></div>`}
    <input class="search" id="q" placeholder="Search shop, town or owner" value="${esc(filt.q)}">
    <div class="chips"><button class="chip ${!filt.lead ? 'on' : ''}" data-l="">All</button>${SYS4.map(k => `<button class="chip ${filt.lead === k ? 'on' : ''}" data-l="${k}">${TAG[k]}</button>`).join('')}</div>
    ${[1,2,3,4].map(t => { const r = rows(t); return r ? `<div class="grp"><span>${esc(D.groups[t].name)}</span><span>${(r.match(/class="row/g) || []).length}</span></div><p class="grpwhy">${esc(D.groups[t].why)}</p>${r}` : ''; }).join('') || '<p class="grpwhy" style="margin-top:14px">No match.</p>'}
    <p class="foot">Green dot: ready. Yellow: check first. Red: on hold. "Need" adds the four scores (0 to 3 each).</p>`;
  $('#q').oninput = e => { filt.q = e.target.value.toLowerCase().trim(); const pos = e.target.selectionStart; side(activeId); const q = $('#q'); q.focus(); q.setSelectionRange(pos,pos); };

  $('.main').scrollTop = 0; window.scrollTo({top:0});
}
document.addEventListener('keydown', e => { if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return; const on = $('.stepb.on'); if(!on || !$('#p-call') || $('#p-call').classList.contains('hidden')) return; const i = $$('.stepb').indexOf(on); if(e.key === 'ArrowRight' && i < 4) $$('.stepb')[i + 1].click(); if(e.key === 'ArrowLeft' && i > 0) $$('.stepb')[i - 1].click(); });
window.addEventListener('hashchange', route);
route();
</script>
